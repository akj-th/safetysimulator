<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>지자체 사전진단서</title>

<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
/* ════════════════════════════════════════════════════════════════════
   문서 두 종 — 사전진단서 / 현장용 리포트

   AURI 요청으로 문서를 둘로 나눴습니다.
     사전진단서   AURI 양식 그대로. 원문에 없는 요소는 넣지 않습니다
     현장용 리포트 현장에서 볼 것만. 통계 서술은 최소로

   탭으로 오가고, **인쇄하면 지금 보고 있는 문서만** 나옵니다.
   ════════════════════════════════════════════════════════════════════ */

.doc{
  max-width:820px; margin:0 auto; background:var(--w);
  font-size:var(--fs-body); color:var(--g4); line-height:1.85;
}

.chapter{padding:0 0 34px}
.chapter + .chapter{border-top:1px solid var(--g1); padding-top:34px}

.h-chapter{
  font-size:var(--fs-h2); font-weight:700; color:var(--k);
  margin:0 0 20px; padding-bottom:11px; border-bottom:2px solid var(--k);
}
.h-section{font-size:var(--fs-lead); font-weight:700; color:var(--k); margin:26px 0 12px}
.h-sub{font-size:var(--fs-cap); font-weight:400; color:var(--g2); margin-left:8px}
.sim-row td{background:rgba(216,61,100,.04)}
.auri-plan td{font-size:var(--fs-sm); line-height:1.55}
.auri-checks{list-style:none; padding-left:6px; margin:4px 0 0; font-size:var(--fs-sm)} .auri-checks li{margin:3px 0}

/* 원문의 "○ (항목) 내용" 형식 */
.bullet{margin:9px 0 9px 2px; padding-left:19px; position:relative; text-align:justify}
.bullet::before{content:'○'; position:absolute; left:0; color:var(--g2)}
.bullet .tag{font-weight:700; color:var(--k)}
.bullet b{color:var(--k); font-weight:700}

.doc table{width:100%; margin:12px 0 6px}
.doc table.tight th, .doc table.tight td{padding:8px 10px; font-size:var(--fs-sm)}
/* ★ 문서 표 머리행은 옅은 회색입니다 (담당자 확인 2026-09-07).
   전 화면 기본값은 검정 바탕 + 흰 글씨지만(theme.css), 문서는 표가 많아
   검정이 줄줄이 이어지면 화면에서도 인쇄물에서도 너무 강합니다.
   목차 구분은 되면서 잉크를 덜 먹는 정도로 낮춥니다. 이 규칙은 .doc 안에만
   적용되므로 지도·리포트 화면의 표는 그대로입니다. */
.doc th{background:#F5F5F5; color:#000; border-bottom:1px solid var(--g1)}
.doc caption{
  caption-side:top; text-align:left; font-weight:700; color:var(--k);
  font-size:var(--fs-body); padding-bottom:7px;
}
.note-under{font-size:var(--fs-cap); color:var(--g2); line-height:1.7; margin:6px 0 0}


/* ── 표지 ────────────────────────────────────────────────────────── */
.cover{
  min-height:70vh; display:flex; flex-direction:column;
  align-items:center; justify-content:center; text-align:center; gap:18px;
}
.cover .kicker{font-size:var(--fs-cap); font-weight:700; letter-spacing:.3em; color:var(--g2)}
.cover h1{font-size:42px; font-weight:700; color:var(--k); letter-spacing:-.02em; margin:0; line-height:1.3}
.cover .region{font-size:var(--fs-h2); color:var(--g3); margin:0}
.cover .meta{margin-top:30px; font-size:var(--fs-sm); color:var(--g2); line-height:1.9}
.cover .rule{width:60px; height:2px; background:var(--k)}

/* ── 탭 ──────────────────────────────────────────────────────────── */
.doc-tabs{display:flex; gap:0; border-bottom:1px solid var(--g1); margin-bottom:30px}
.doc-tab{
  padding:13px 22px; border:none; background:none; cursor:pointer;
  font-family:inherit; font-size:var(--fs-body); color:var(--g2);
  border-bottom:2px solid transparent; margin-bottom:-1px;
}
.doc-tab.on{color:var(--k); font-weight:700; border-bottom-color:var(--k)}
.doc-tab:disabled{opacity:.4; cursor:default}
.doc-edit-btn{color:var(--k); font-weight:700}
.doc-edit-btn.saving{background:var(--k); color:var(--w)}
.doc-edit-cancel, .doc-edit-reset{color:var(--g3)}
/* 수정 모드 — 점선 테두리로 "지금 고치는 중"을 보임. 인쇄에는 안 나감 */
.doc.editing{outline:2px dashed var(--main); outline-offset:14px; cursor:text}
.doc.editing [contenteditable="true"]:focus{outline:none}
.doc-note-edit{font-size:var(--fs-sm); color:var(--main); margin:0 0 14px}
.doc-note-edit[hidden]{display:none}
.doc-tab:hover{color:var(--k)}

/* ── 4장: 좌 지도 / 우 현장사진 (원문 배치) ───────────────────────── */
.field-pair{display:grid; grid-template-columns:1fr 1fr; gap:16px; margin:12px 0 4px}
@media(max-width:700px){ .field-pair{grid-template-columns:1fr} }
.field-pair figure{margin:0}
.field-pair img, .field-pair .slot{
  width:100%; aspect-ratio:4/3; object-fit:cover; display:block;
  border:1px solid var(--g1); background:var(--w);
}
/* 위 display:block 이 hidden 속성보다 세서 그냥 두면 감춰지지 않습니다.
   지도는 다 그려질 때까지 감춰 두어야 하므로 되살립니다. */
img[hidden]{display:none !important}
.field-pair .slot{
  display:flex; align-items:center; justify-content:center; text-align:center;
  padding:18px; font-size:var(--fs-sm); color:var(--g2); line-height:1.7;
}
.field-pair figcaption{
  font-size:var(--fs-cap); color:var(--g2); margin-top:7px; line-height:1.6;
}

/* 사진 목록 (화면 전용 관리 UI) */
/* ── 문서에 싣는 지도 ─────────────────────────────────────────────
   화면에 지도를 띄우는 것이 아니라 캔버스에 그려 그림으로 넣습니다.
   그래야 인쇄와 PDF 에 그대로 남습니다 (assets/doc-map.js 참고). */
/* 한 절에 사진이 두 장 이상일 때 아래에 작게 붙입니다 */
.photo-strip{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; margin:10px 0 4px}
.photo-strip figure{margin:0}
.photo-strip img{width:100%; aspect-ratio:4/3; object-fit:cover; display:block; border:1px solid var(--g1)}
.photo-strip figcaption{font-size:var(--fs-cap); color:var(--g2); margin-top:5px; line-height:1.55}

.doc-map{margin:14px 0 6px}
.doc-map img{width:100%; display:block; border:1px solid var(--g1)}
.doc-map .wait{
  width:100%; aspect-ratio:16/10; border:1px solid var(--g1);
  display:flex; align-items:center; justify-content:center;
  font-size:var(--fs-sm); color:var(--g2); background:var(--w); text-align:center;
}
.doc-map figcaption{
  font-size:var(--fs-cap); color:var(--g2); text-align:center;
  margin-top:7px; line-height:var(--lh-tight);
}
.map-legend{
  display:flex; flex-wrap:wrap; gap:5px 16px; justify-content:center;
  margin-top:7px; font-size:var(--fs-cap); color:var(--g3);
}
.map-legend i{display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:5px}

/* 위치를 지도에서 찍는 창 */
.pick-wrap{
  position:fixed; inset:0; background:rgba(0,0,0,.55); z-index:90;
  display:flex; align-items:center; justify-content:center; padding:24px;
}
.pick-box{background:var(--w); padding:20px; max-width:760px; width:100%}
.pick-box canvas{width:100%; display:block; border:1px solid var(--g1); cursor:crosshair}
.pick-box .hd{display:flex; align-items:center; gap:12px; margin-bottom:12px; flex-wrap:wrap}
.pick-box .hd b{font-size:var(--fs-body)}
.pick-box .hd span{font-size:var(--fs-cap); color:var(--g2)}
.pick-box .ft{display:flex; gap:10px; justify-content:flex-end; margin-top:14px}

.photo-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:14px; margin-top:12px}
.photo-card{border:1px solid var(--g1); padding:9px}
.photo-card img{width:100%; aspect-ratio:4/3; object-fit:cover; display:block}
.photo-card .cap{font-size:var(--fs-cap); color:var(--g2); margin-top:6px; line-height:1.6; word-break:break-all}
.photo-card select, .photo-card input[type=text]{
  width:100%; margin-top:6px; padding:6px 8px; border:1px solid var(--g1);
  font-family:inherit; font-size:var(--fs-cap); background:var(--w); border-radius:0;
}
.photo-card .row{display:flex; gap:6px; margin-top:6px; align-items:center}
.photo-card .cap.no-gps{color:var(--main)}
.photo-card input{margin-top:6px; padding:7px 9px; font-size:var(--fs-cap)}
.photo-card .rm{margin-top:6px}

/* ── 현장용 리포트 ───────────────────────────────────────────────── */
.field-head{
  display:grid; grid-template-columns:repeat(3,1fr); gap:0;
  border-top:1px solid var(--k); border-bottom:1px solid var(--g1);
}
@media(max-width:700px){ .field-head{grid-template-columns:1fr} }
.field-head .cell{padding:14px 18px 14px 0}
.field-head .k{font-size:var(--fs-cap); font-weight:700; letter-spacing:.12em; color:var(--g2)}
.field-head .v{font-size:var(--fs-body); color:var(--k); margin-top:5px; font-weight:700}
.field-head .s{font-size:var(--fs-cap); color:var(--g2); margin-top:3px}

/* 현장 확인사항 — 범주별 */
.chk-group{margin:18px 0}
.chk-group .g-head{
  display:flex; align-items:baseline; gap:10px;
  padding-bottom:7px; border-bottom:1px solid var(--k);
}
.chk-group .g-name{font-size:var(--fs-body); font-weight:700; color:var(--k)}
.chk-group .g-desc{font-size:var(--fs-cap); color:var(--g2)}
.chk-group ul{margin:10px 0 0; padding-left:0; list-style:none}
.chk-group li{
  display:flex; gap:11px; align-items:flex-start;
  padding:9px 0; border-bottom:1px solid var(--g1); line-height:1.7;
}
.chk-group li .box{
  flex:none; width:13px; height:13px; margin-top:5px;
  border:1px solid var(--g2);
}
.chk-group li .tx{flex:1; min-width:0}
.chk-group li .fd{font-size:var(--fs-cap); color:var(--g2); margin-left:7px; white-space:nowrap}

/* 개선 전/후 — 상하로 크게 (좌우로 놓으니 작아서 안 보인다는 의견) */
.ba-stack{margin:14px 0}
/* ★ 2026-10-20 실무회의 — 거점 카드 · 행안부 카드 · 번호 태그 범례 · 한 줄 편집칸 */
.hot-card{border-top:1px solid var(--k); padding-top:10px; margin-top:18px; page-break-inside:avoid}
.hot-card:first-of-type{margin-top:6px}
.hot-grid{display:grid; grid-template-columns:1fr 1fr; gap:18px}
@media(max-width:700px){ .hot-grid{grid-template-columns:1fr} }
.hot-grid .ba-stack figure{margin:0 0 10px}
.tag-legend{display:flex; flex-wrap:wrap; gap:6px 18px; margin:-12px 0 12px; font-size:var(--fs-sm); color:var(--g3)}
.tag-legend b{display:inline-block; width:20px; height:20px; line-height:18px; text-align:center; border:1px solid var(--k); border-radius:50%; background:var(--w); color:var(--k); font-size:var(--fs-cap); margin-right:4px}
.mois-title{font-weight:700; font-size:var(--fs-lead); padding:8px 10px; border:1px solid var(--k); margin:0 0 -1px}
.mois-head th{background:#F5F5F5}
.mois-two{display:grid; grid-template-columns:1fr 1fr; gap:16px; align-items:start}
@media(max-width:700px){ .mois-two{grid-template-columns:1fr} }
.mois-two figure{margin:0} .mois-two img{width:100%; display:block; border:1px solid var(--g1)}
.doc-inline{display:inline-block; min-width:80px; border-bottom:1px dashed var(--g2); padding:0 4px; outline:none}
.doc-inline:empty::before{content:attr(data-hint); color:var(--g2); font-weight:400}
@media print{ .doc-inline{border-bottom:none} .doc-inline:empty::before{content:''} }
.ba-stack figure{margin:0 0 22px}
.ba-stack img{width:100%; display:block; border:1px solid var(--g1); background:var(--w)}
.ba-stack .slot{
  width:100%; aspect-ratio:16/9; border:1px solid var(--g1);
  display:flex; align-items:center; justify-content:center; text-align:center;
  padding:24px; font-size:var(--fs-sm); color:var(--g2);
}
.ba-stack figcaption{
  font-size:var(--fs-cap); font-weight:700; letter-spacing:.12em; color:var(--g2);
  margin-top:9px;
}
/* AI 생성 이미지라는 사실은 인쇄물에도 반드시 남습니다 */
.ba-disclaimer{
  margin-top:7px; padding:9px 12px; border-left:2px solid var(--main);
  font-size:var(--fs-sm); color:var(--g3); line-height:1.7;
}

/* ── 인쇄 ────────────────────────────────────────────────────────── */
@page{ size:A4 portrait; margin:18mm 16mm 20mm; }

@media print{
  body{background:#fff}
  .topbar, .page-head, .picked, .btn, .note, .screen-only, .doc-tabs{display:none !important}
  .wrap{max-width:none; padding:0}
  .doc{max-width:none; font-size:10.5pt; line-height:1.7}
  /* 지금 보고 있는 문서만 인쇄합니다 */
  .doc[hidden]{display:none !important}

  .h-chapter{font-size:15pt} .h-section{font-size:12pt}
  .cover{min-height:0; height:240mm; page-break-after:always}
  .cover h1{font-size:30pt}

  .chapter{page-break-before:always; border-top:none; padding-top:0}
  .chapter:first-of-type{page-break-before:auto}
  table, .field-pair, .chk-group, .ba-stack figure,
  .doc-map, .photo-strip figure{page-break-inside:avoid}
  .h-section{page-break-after:avoid}

  /* 머리행은 옅은 회색 — 검정은 인쇄물에서 너무 튑니다 (담당자 확인 2026-09-07).
     목차 구분은 되면서 잉크를 덜 먹는 정도로 둡니다. */
  th{background:#F5F5F5 !important; color:#000 !important;
     -webkit-print-color-adjust:exact; print-color-adjust:exact}
  /* 개입 유형 배경색은 인쇄에서도 남깁니다 (표에서 유형을 구분하는 장치) */
  .hea-E, .hea-A, .hea-H{-webkit-print-color-adjust:exact; print-color-adjust:exact}

  .print-foot{
    display:block !important;
    position:fixed; bottom:0; left:0; right:0;
    font-size:8.5pt; color:#666;
    border-top:1px solid #ccc; padding-top:2mm;
  }
}
.print-foot{display:none}
</style>
</head>
<body data-step="5">

<header class="topbar" id="topbar"></header>

<main class="wrap">
  <div class="page-head screen-only" style="display:flex; align-items:flex-end; justify-content:space-between; gap:20px; max-width:none; flex-wrap:wrap">
    <div style="max-width:720px">
      <h1>진단 문서</h1>
      <p class="sub">현장용 리포트로 현장에 나가기 전 확인할 것을 먼저 보고, 사전진단서는 AURI 양식 그대로 그다음에 정리합니다. 인쇄하면 지금 보고 있는 문서만 나옵니다.</p>
    </div>
    <!-- Word 내보내기는 뺐습니다(2026-10-21): 글·표·그림만 넘어가고 배열·여백·레이아웃이 안 넘어가 쓸 수 없음. 대신 아래 "수정" 모드 -->
    <button class="btn ghost" id="printBtn" onclick="window.print()">인쇄 / PDF 저장</button>
  </div>

  <!-- ★ 순서: 현장용 리포트 → 사전진단서 (2026-09-14 AURI 회의)
       "현장에 나가기 전 예비 확인을 먼저 하고, 사전진단서가 그다음 결과로 나오는 순서가 맞다"
       안쪽 이름(A=사전진단서, B=현장용)은 그대로 두고 보이는 순서와 첫 선택만 바꿨습니다. -->
  <!-- 세 번째 탭 "행안부 리포트(초안)" (2026-10-16, 10/14 AURI 회의 ②): 행안부가 지정한 양식으로 "누른 것이 그대로 보고서로"
       나가야 합니다. 양식 원본(한글 2건)은 아직 받지 못해 회의에서 말한 네 요소(개선 전/후 · 위험요인 분석 문장 · 맞춤형 사업
       리스트 · 요인별 점수)만 모은 뼈대입니다. 현장 확인사항은 현장 배포용이라 넣지 않습니다(회의 결정). -->
  <div class="doc-tabs screen-only">
    <button type="button" class="doc-tab on" id="tabB" onclick="showDoc('b')">현장용 리포트</button>
    <button type="button" class="doc-tab" id="tabA" onclick="showDoc('a')">사전진단서</button>
    <!-- 행안부 리포트 탭은 양식 원본·논의가 정리될 때까지 감춥니다 (담당자 2026-10-22). hidden 만 지우면 다시 보입니다 -->
    <button type="button" class="doc-tab" id="tabC" onclick="showDoc('c')" hidden>행안부 리포트(초안)</button>
    <span style="flex:1"></span>
    <!-- ★ 수정 모드 (2026-10-21 담당자) — 보고 있는 탭의 어떤 글이든 고칠 수 있음. 수정 중에는 인쇄가 잠기고, 저장하면 다시 풀림 -->
    <button type="button" class="doc-tab doc-edit-reset" id="editReset" hidden onclick="resetEdit()" title="이 탭의 수정 내용을 버리고 자동 생성 문서로 되돌립니다">원래대로</button>
    <button type="button" class="doc-tab doc-edit-cancel" id="editCancel" hidden onclick="cancelEdit()">취소</button>
    <button type="button" class="doc-tab doc-edit-btn" id="editBtn" onclick="toggleEdit()" title="문서의 글을 직접 고칩니다">✎ 수정</button>
  </div>

  <p class="doc-note-edit screen-only" id="docNoteEdit" hidden>수정 중입니다 — 글을 바로 고친 뒤 오른쪽 위 <b>저장</b>을 누르세요. 저장 전에는 인쇄·탭 이동이 잠깁니다.</p>
  <p class="note screen-only" id="docNote">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg>
    <span id="docNoteText"></span>
  </p>

  <div class="doc" id="docB"></div>
  <div class="doc" id="docA" hidden></div>
  <div class="doc" id="docC" hidden></div>

  <div class="print-foot" id="printFoot">현장 확인 리포트</div>
</main>

<script src="assets/auth.js"></script>
<script src="assets/projects.js"></script>

<script src="assets/stats.js"></script>

<script src="assets/doc-edit.js"></script>
<script src="assets/site-photo.js"></script>

<script src="assets/physical.js"></script>

<script>
/* ════════════════════════════════════════════════════════════════════
   문서 만들기

   ── 문장을 규칙으로 만드는 이유 ─────────────────────────────────────

   깨지므로, 수치가 들어가는 문장은 **증감 패턴에 따라 갈라 쓰는 규칙**으로만
   만듭니다. AI는 (소결)처럼 **판단이 필요한 자리에서 버튼을 눌렀을 때만**
   초안을 냅니다 (assets/doc-edit.js).

const YEARS = ['2023', '2024', '2025'];
const esc = (s) => String(s == null ? '' : s)
  .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
const nf = (n) => (n == null ? '—' : Number(n).toLocaleString());

let _data = null, _national = null, _focus = [], _stats = null;
let _dongHea = null;              // 3.3 읍면동별 HEA 지표 (data/dong/<지역>.json)

/* ── 2.1 서술 문장 (규칙 기반) ────────────────────────────────────
   증가 / 감소 / 등락 / 보합 네 갈래. 문장은 명사형으로 끝냅니다. */
function trendSentence(label, years, ratio) {
  const a = years['2023'] || 0, b = years['2024'] || 0, c = years['2025'] || 0;
  const total = a + b + c;
  const pct = a ? Math.round((c - a) / a * 1000) / 10 : null;
  const y1 = `${YEARS[1]}년 ${nf(b)}건`, y2 = `${YEARS[2]}년 ${nf(c)}건`;

  let shape, kind, end;
  if (a <= b && b <= c && c > a) {
    kind = 'up'; shape = `${nf(a)}건에서 ${y2}으로 지속 증가(${pct}%↑)`; end = ['하며', '하며'];
  } else if (a >= b && b >= c && c < a) {
    kind = 'down'; shape = `${nf(a)}건에서 ${y2}으로 지속 감소(${Math.abs(pct)}%↓)`; end = ['하고 있으나', '하고 있으며'];
  } else if (b < a && c > b) {
    kind = 'swing'; shape = `${nf(a)}건에서 ${y1}으로 감소했다가 ${y2}으로 ${c > a ? '급증' : '반등'}하는 등락을 보이`; end = ['나', '며'];
  } else if (b > a && c < b) {
    kind = 'swing'; shape = `${nf(a)}건에서 ${y1}으로 증가했다가 ${y2}으로 감소하는 등락을 보이`; end = ['나', '며'];
  } else {
    kind = 'flat'; shape = `3개년 ${nf(total)}건으로 뚜렷한 추세 없이 유지되고 있`; end = ['으나', '으며'];
  }
  shape += (ratio !== null && ratio >= 1.1) ? end[0] : end[1];

  /* "추세와 무관하게"는 감소·등락인데도 평균보다 높을 때만 붙입니다 */
  const despite = (kind === 'down' || kind === 'swing') ? '추세와 무관하게 ' : '';
  const much = ratio >= 2 ? '크게 ' : '';
  const cmp = ratio === null ? ' 비교 가능한 평균값 없음'
    : ratio >= 1.1 ? ` 3개년 발생 건수는 41개 지자체 평균 대비 <b>${ratio}배</b>로 ${despite}평균을 ${much}상회`
    : ratio <= 0.9 ? ` 3개년 발생 건수는 41개 지자체 평균 대비 <b>${ratio}배</b>로 평균 이하 수준`
    : ' 3개년 발생 건수는 41개 지자체 평균과 비슷한 수준';

  return `<span class="tag">(${label})</span> ${label} 발생 건수는 ${YEARS[0]}년 ${shape},${cmp}`;
}

/* ════════════════════════════════════════════════════════════════════
   사전진단서 — AURI 양식 그대로
   표지 / 1.개요 / 2.중점관리분야 / 3.공간분석 / 4.밀집구간별 / 5.부록

function cover() {
  const now = new Date();
  const d = `${now.getFullYear()}. ${String(now.getMonth() + 1).padStart(2, '0')}. ${String(now.getDate()).padStart(2, '0')}.`;
  return `
  <section class="cover">
    <div class="kicker">안전사업지구 사업모델 개발 연구용역</div>
    <h1>지역 안전진단 사전분석 보고서</h1>
    <div class="rule"></div>
    <p class="region">— ${esc(_data ? _data.label : (_picked.addr || '대상지'))} —</p>
    <div class="meta">
      작성일 ${d}<br>
      자료원 119 구급출동 데이터 (2023~2025년)${_auri && _auri.sourceDate ? ' · AURI 사전분석 보고서 ' + _auri.sourceDate : ''}<br>
      건축공간연구원 · Atelier KJ
    </div>
  </section>`;
}

/* ════════════════════════════════════════════════════════════════════
   ★ 사전진단서 본문 = AURI 「지역 안전진단 사전분석 보고서」와 같은 구조 (2026-10-20)

   AURI 가 지자체마다 보내는 보고서(hwpx)를 tools/build-auri-reports.mjs 가 구조화해
   data/stats/auri-reports/<지역>.json 으로 두고, 여기서 그 글을 **그대로** 싣습니다.
     1. 중점관리분야 및 복합위험지구 선정   ← AURI 글(전체본 4곳) / 없으면 우리 통계로
     2. 복합위험지구 사고 다발지 및 맞춤형 사업(안)  ← AURI 표(22곳) + 우리 지도·이미지·진단 지점 처방(시뮬레이터 표시)
     [그림] 종합도                          ← tools/overview-map 산출물 자리
     붙임 1~4                               ← 예전 1·2·3·5장(우리 통계·처방). AURI 보고서의 붙임과 같은 자리
   AURI 글과 우리 산출은 섞지 않습니다 — 우리 것에는 "시뮬레이터" 표시가 붙습니다.
   ════════════════════════════════════════════════════════════════════ */
const AURI_HEA_LABEL = { E: '[E] 환경', H: '[H] 피해대상', A: '[A] 행위' };

function auriBullet(b) {
  return `<p class="bullet"><span class="tag">(${esc(b.tag)})</span> ${esc(b.text)}${b.note ? `<br><span class="note-under" style="margin:0">* ${esc(b.note)}</span>` : ''}</p>`;
}

/* ★ AURI 보고서 원문 블록 → HTML (2026-10-21). 1장·붙임처럼 구조화하지 않은 부분을 글·표 그대로 싣습니다 */
function auriBlocksHtml(from, to) {
  const b = (_auri && _auri.blocks) || [];
  const out = [];
  const br = (t) => esc(t).replace(/\n/g, '<br>');
  const imgs = (list, cls) => (list || []).map((src) => `<img src="${esc(src)}" alt="" class="${cls || ''}" style="max-width:100%;display:block;margin:4px auto">`).join('');
  for (let i = from; i < Math.min(to, b.length); i++) {
    const x = b[i];
    if (x.type === 'table') {
      const cellOf = (c) => (typeof c === 'string' ? { text: c, colSpan: 1, rowSpan: 1, imgs: [] } : c);
      const rows = x.rows.map((r) => r.map(cellOf));
      const cap = x.caption ? `<p class="h-sub" style="text-align:center;margin:10px 0 4px">${br(x.caption)}</p>` : '';
      /* 그림만 든 1칸 표 = 그림 틀 (위치도 등) */
      if (rows.length === 1 && rows[0].length === 1 && !rows[0][0].text && (rows[0][0].imgs || []).length) {
        out.push(`<figure class="doc-map" style="margin:8px 0">${imgs(rows[0][0].imgs)}${x.caption ? `<figcaption>${br(x.caption)}</figcaption>` : ''}</figure>`);
        continue;
      }
      const attr = (c) => `${c.colSpan > 1 ? ` colspan="${c.colSpan}"` : ''}${c.rowSpan > 1 ? ` rowspan="${c.rowSpan}"` : ''}`;
      const cell = (c, tag) => `<${tag}${attr(c)}>${br(c.text)}${imgs(c.imgs)}</${tag}>`;
      const head = rows.length > 1 && rows[0].every((c) => c.text.length < 40 && !(c.imgs || []).length) ? `<thead><tr>${rows[0].map((c) => cell(c, 'th')).join('')}</tr></thead>` : '';
      const body = rows.slice(head ? 1 : 0).map((r) => `<tr>${r.map((c) => cell(c, 'td')).join('')}</tr>`).join('');
      out.push(`${cap}<table class="tight auri-raw">${head}<tbody>${body}</tbody></table>`);
    } else if (x.type === 'img') out.push(x.src ? `<figure class="doc-map" style="margin:8px 0">${imgs([x.src])}</figure>` : '');
    else if (x.type === 'h2') out.push(`</section><section class="chapter"><h2 class="h-chapter">${br(x.text)}</h2>`);
    else if (x.type === 'h3') out.push(`<h3 class="h-section">□ ${br(x.text)}</h3>`);
    else if (x.type === 'bullet') out.push(`<p class="bullet">${br(x.text)}</p>`);
    else if (x.type === 'sub') out.push(`<p style="padding-left:44px;margin:2px 0">- ${br(x.text)}</p>`);
    else if (x.type === 'caption') out.push(`<p class="h-sub" style="text-align:center;margin:8px 0 4px">${br(x.text)}</p>`);
    else if (x.type === 'check') out.push(`<p class="bullet" style="padding-left:30px">▸ ${br(x.text)}</p>`);
    else if (x.type === 'note') out.push(`<p class="note-under">${br(x.text)}</p>`);
    else out.push(`<p>${br(x.text)}</p>`);
  }
  return out.join('');
}
/* AURI 붙임(원문) — 2장 뒤의 모든 블록. 전체본(부천 등)에만 있습니다 */
function auriAppendix() {
  if (!_auri || !_auri.blocks || _auri.ch2End == null || _auri.ch2End < 0 || _auri.ch2End >= _auri.blocks.length - 1) return '';
  const html = auriBlocksHtml(_auri.ch2End + 1, _auri.blocks.length);
  if (!html) return '';
  return `<section class="chapter"><p class="h-sub" style="margin:0">붙임 — AURI 사전분석 보고서 원문</p>${html}</section>`;
}

function auriCh1() {
  /* 원문 블록이 있으면(전체본) 1장을 통째로 원문으로 — 글·표 전부 */
  if (_auri && _auri.blocks && _auri.ch2Start > 0) {
    const first = _auri.blocks[0];
    const skip = first && first.type !== 'h2' && /사전분석 보고서|사전진단|^\(.*\)$/.test(first.text || '') ? 1 : 0;   // 표지 제목 줄은 cover 에 있음
    const html = auriBlocksHtml(skip, _auri.ch2Start);
    return `<section class="chapter">${html.replace(/^<\/section><section class="chapter">/, '')}
    ${_dongHea ? `<h3 class="h-section">[참고] 읍면동별 복합 위험도 및 잠재 취약성(HEA) 분석</h3>${AuriDongHea.renderTable(_dongHea, { perTable: 7, fillTo: 7, caption: '[표 2-1] 읍면동별 HEA 지표' })}` : ''}
    </section>`;
  }
  return auriCh1Fallback();
}

function auriCh1Fallback() {
  const name = _data.shortLabel;
  const c = _auri && _auri.ch1;
  const focusLine = _focus.map((f) => f.label).join('·');
  let body = '';
  if (c && c.bullets.length) {
    const isFocus = (b) => _focus.some((f) => f.label === b.tag);
    body = `
    <p class="bullet" style="margin-top:0"><b>□ 중점관리분야</b> : 사고 빈도와 정책적 시급성을 종합 분석하여 <b>${esc(focusLine)}</b> 3개 분야 선정</p>
    ${c.bullets.filter(isFocus).map(auriBullet).join('')}
    <p class="bullet" style="margin-top:14px"><b>□ 복합위험지구</b></p>
    ${c.bullets.filter((b) => !isFocus(b)).map(auriBullet).join('')}
    ${c.hea.length ? `<h3 class="h-section">구조적 잠재 취약성 분석(HEA 분석)</h3>${c.hea.map((t) => `<p class="bullet">${esc(t.replace(/^○\s*/, ''))}</p>`).join('')}` : ''}
    ${c.combined.length ? `<h3 class="h-section">복합위험지구와 잠재 취약성 결합 분석</h3>
      <table class="tight"><thead><tr><th style="width:18%">구분</th><th style="width:20%">유형</th><th style="width:28%">행정동</th><th>위험 분야(관리지역 이상)</th></tr></thead>
      <tbody>${c.combined.map((r) => `<tr><td>${esc(r.group)}</td><td>${esc(r.type)}</td><td>${esc(r.dongs)}</td><td>${esc(r.risk)}</td></tr>`).join('')}</tbody></table>` : ''}
    <p class="note-under">* 이 장은 AURI 사전분석 보고서(${esc(_auri.sourceDate || '')}) 원문입니다.</p>`;
  } else {
    /* AURI 1장이 없는 지자체(약식 보고서 18곳 · 미수령 19곳): 우리 통계로 같은 꼴을 채우고 표시를 남깁니다 */
    const count = (_national && _national.regionCount) || 41;
    const rows = _focus.map((f) => {
      const y = f.cat.region.years || {};
      const total = YEARS.reduce((s2, k) => s2 + (y[k] || 0), 0);
      const nat = _national && _national.categories[f.key];
      const avg = nat ? nat.n / count : null;
      return { f, total, ratio: avg ? (total / avg).toFixed(2) : null, inside: f.cat.count ? f.cat.count.inside : null };
    });
    const areaHa = _data.surveyArea && _data.surveyArea.areaHa;
    body = `
    <p class="bullet" style="margin-top:0"><b>□ 중점관리분야</b> : 강원대 분석으로 확정된 <b>${esc(focusLine)}</b> 3개 분야</p>
    ${rows.map((r) => `<p class="bullet"><span class="tag">(${esc(r.f.label)})</span> 3개년 구급출동 ${r.total.toLocaleString()}건${r.ratio ? `, 41개 지자체 평균의 ${r.ratio}배` : ''}${r.inside != null ? `, 복합위험지구 안 ${r.inside.toLocaleString()}건` : ''}</p>`).join('')}
    <p class="bullet" style="margin-top:14px"><b>□ 복합위험지구</b></p>
    <p class="bullet"><span class="tag">(대상지)</span> ${esc(_data.label)} 조사지 약 ${areaHa ? (areaHa / 100).toFixed(2) + '㎢' : '-'}${_picked.dong ? ` (진단 지점: ${esc(_picked.dong)})` : ''}</p>
`;
  }
  return `
  <section class="chapter">
    <h2 class="h-chapter">1. ${esc(name)} 중점관리분야 및 복합위험지구 선정</h2>
    ${body}
    ${_dongHea ? `<h3 class="h-section">[참고] 읍면동별 복합 위험도 및 잠재 취약성(HEA) 분석</h3>${AuriDongHea.renderTable(_dongHea, { perTable: 7, fillTo: 7, caption: `[표 1-1] ${_data.shortLabel} 읍면동별 HEA 취약도 지표` })}` : ''}
  </section>`;
}

/* 대책 칸 — "[인프라 개선]" 묶음 머리 + (E)/(H)/(A) 줄 + → 보충 */
function auriMeasures(list) {
  let grp = '';
  return list.map((m) => {
    const head = m.group && m.group !== grp ? `<div style="font-weight:700;margin-top:4px">[${esc(m.group)}]</div>` : '';
    grp = m.group || grp;
    return head + `<div class="hea-${m.hea}" style="padding:2px 4px"><span class="hea-tag k-${m.hea}">${AURI_HEA_LABEL[m.hea] || esc(m.hea)}</span> ${esc(m.text)}${m.notes.length ? `<br><span style="font-size:var(--fs-cap);color:var(--g2)">${m.notes.map((t) => '→ ' + esc(t)).join('<br>')}</span>` : ''}</div>`;
  }).join('');
}

    const figLoc = fig++, figEx = fig++;
    return `

    /* 물적환경 회귀분석 — 7개 지자체에만 있습니다.

       어느 쪽인지는 문장 앞머리에 그대로 적힙니다. */
    const phys = AuriPhysical.narrate(_data.region, f.key, {
      catLabel: f.label, fallback: true, limit: 4,
    });
    const mine = _items.filter((it) => it.field === f.key || it.category === f.label);
    /* 이 절에 배정된 사진. 여러 장이면 첫 장을 크게 싣고 나머지는 아래에 붙입니다 */
    const mineP = photos.filter((p) => p.field === f.key);
    const photo = mineP[0] || null;
    const extra = mineP.slice(1);

    return `
      <h3 class="h-section">4.${i + 1} ${f.label}</h3>

      <div class="field-pair">
        <figure>
          <img id="map-${f.key}" alt="${f.label} 밀집도" hidden>
          <div class="slot" id="map-${f.key}-wait">지도를 그리는 중입니다…</div>
          <figcaption>${esc(_data.shortLabel)} ${f.label} 밀집도 — 진단 지점 반경 ${MAP_RADIUS_M}m</figcaption>
        </figure>
        <figure>
          ${photo
            ? `<img src="${photo.dataUrl}" alt="현장 사진">`
            : '<div class="slot">현장 사진<br><span style="font-size:var(--fs-cap)">아래 <b>현장 사진</b>에서 올리고 이 절을 고르면 여기에 실립니다</span></div>'}
          <figcaption>${photo ? esc(AuriSitePhoto.caption(photo)) + (photo.note ? ' — ' + esc(photo.note) : '') : '현장확인사항'}</figcaption>
        </figure>
      </div>

      ${extra.length ? `<div class="photo-strip">${extra.map(function (p) {
        return `<figure><img src="${p.dataUrl}" alt="현장 사진">
          <figcaption>${esc(AuriSitePhoto.caption(p))}${p.note ? ' — ' + esc(p.note) : ''}</figcaption></figure>`;
      }).join('')}</div>` : ''}

      <table class="tight">
        <caption>[표 ${3 + i}] 밀집구간별 사고 원인 및 개선방향 — ${f.label}</caption>
        <tbody>
          <tr>
            <th style="width:18%; vertical-align:top">사고 특성·원인</th>
            <td>
              ${human ? `<p class="bullet" style="margin-top:0"><span class="tag">(인적요인)</span> ${human.text}</p>` : ''}
              ${type ? `<p class="bullet"><span class="tag">(사고유형)</span> ${type.text}</p>` : ''}
              <p class="bullet"><span class="tag">(물적환경)</span> ${
                observed ? esc(observed)
                : (r ? `사진 판독 ${r.level.label} 판정(${r.score}점)` : '사진 판독 결과 없음')}</p>
              ${phys ? `<p class="bullet"><span class="tag">(관련요인)</span> ${esc(phys.text)}
                <br><span style="font-size:var(--fs-cap);color:var(--g2)">${esc(phys.basis)} · 출처: ${esc(AuriPhysical.source())}</span></p>` : ''}
            </td>
          </tr>
          <tr>
            <th style="vertical-align:top">맞춤형 사업</th>
            <td>${mine.length ? mine.map(function (it) {
              const p = AuriPalette.byName(it.name);
              return `<p class="bullet ${it.hea ? 'hea-' + it.hea : ''}" style="margin-top:0; padding:6px 8px 6px 25px">
                <b>${esc(it.name)}</b>
                <span class="hea-tag k-${it.hea}">${AuriPalette.heaLabel(it.hea, true)}</span>
                ${p && p.effect ? `<br><span style="font-size:var(--fs-sm)">${esc(p.effect)}</span>` : ''}
                ${p && p.source ? `<br><span style="font-size:var(--fs-cap);color:var(--g2)">출처: ${esc(p.source)}</span>` : ''}
              </p>`;
            }).join('') : '<p class="bullet" style="margin-top:0">처방된 사업 없음</p>'}</td>
          </tr>
        </tbody>
      </table>`;
  }).join('');

  return `
  <section class="chapter">
    <h2 class="h-chapter">4. 밀집구간별 사고 원인 및 개선방향</h2>
    ${blocks}
    ${photoManager()}
  </section>`;
}

/* ════════════════════════════════════════════════════════════════════
   ★ 사업 리스트 구분 — 환경 개선(E, 이미지 반영) / 소프트웨어(H·A, 참고 목록) + 효과 레퍼런스 한 줄
   (2026-10-20 AURI 실무회의). 붙임 4 · 현장용 리포트 · 행안부 리포트가 **같은 함수**를 씁니다.
   opts.amount = 사업비 열 · opts.basis = 근거 열
   ════════════════════════════════════════════════════════════════════ */
function rxSplitTables(items, opts) {
  opts = opts || {};
  const env = items.filter((it) => it.hea === 'E');
  const soft = items.filter((it) => it.hea !== 'E');
  let total = 0, unpriced = 0;
  const row = (it) => {
    const p = AuriPalette.byName(it.name);
    const a = p ? p.amount : null;
    if (opts.amount) { if (a && a.won) total += a.won; else unpriced++; }
    const eff = AuriPalette.effectLabel(p);
    const src = p ? AuriPalette.sourceShort(p.source) : '';
    return `<tr class="${it.hea ? 'hea-' + it.hea : ''}">
      <td>${esc(it.name)}${it.required ? ' <span class="h-sub">필수</span>' : ''}${p && p.std ? `<br><span style="font-size:var(--fs-cap);color:var(--g2)">${esc(p.std.spaceType || '')}${p.std.unit ? ' · ' + esc(p.std.unit) : ''}</span>` : ''}</td>
      <td>${esc(it.category)}</td>
      <td><span class="hea-tag k-${it.hea}">${it.hea ? AuriPalette.heaLabel(it.hea, true) : '—'}</span></td>
      <td>${it.priority ? it.priority.label : '-'}</td>
      <td style="font-size:var(--fs-cap)">${eff ? esc(eff) + (src ? `<br><span style="color:var(--g2)">${esc(src)}</span>` : '') : '<span style="color:var(--g2)">—</span>'}</td>
      ${opts.amount ? `<td class="num">${a && a.won ? auriWon(a.won) + (a.unit ? ' / ' + a.unit : '') : '산출 근거 필요'}</td>` : ''}
      ${opts.basis ? `<td style="font-size:var(--fs-cap);color:var(--g2)">${it.trigger ? esc(it.trigger.id + ' ' + (it.trigger.note || '')) : (it.custom ? '연구원 추가' : '통계 처방')}</td>` : ''}
    </tr>`;
  };
  const table = (list, title, hint) => `
    <p class="bullet" style="font-weight:700;margin:14px 0 6px;padding-left:0">${title} <span class="h-sub">${hint}</span></p>
    ${list.length ? `<table class="tight"><thead><tr>
      <th style="width:28%">사업</th><th style="width:10%">분야</th><th style="width:12%">개입</th><th style="width:9%">우선</th><th>효과 레퍼런스</th>${opts.amount ? '<th class="num" style="width:15%">사업비</th>' : ''}${opts.basis ? '<th style="width:17%">근거</th>' : ''}
    </tr></thead><tbody>${list.map(row).join('')}</tbody></table>` : '<p class="bullet">해당 없음</p>'}`;
  const sum = opts.amount ? `<p class="bullet" style="text-align:right;padding-left:0"><b>합계</b> — 총 ${items.length}종${unpriced ? ` (산출 근거 필요 ${unpriced}종 제외)` : ''} · ${total ? auriWon(total) : '산출 불가'}</p>` : '';
  const foot = `<p class="note-under">* <b>환경 개선 사업</b>만 개선 후 이미지에 들어갑니다. 교육·단속·상담·지원은 거리 사진에 나타나지 않아 <b>참고 목록</b>으로 둡니다.<br>
    * 효과 레퍼런스 = 사업 팔레트의 국내 실증·정책근거(효과 칸) 요약.${opts.amount ? '<br>* 사업비는 단위와 금액이 분명한 사업만 산정. 지자체 총액·범위·국비 분담 기재분은 제외. 부가세 제외' : ''}</p>`;
  return table(env, '① 환경 개선 사업', '[E] 환경적 개입 — 개선 이미지에 반영')
       + table(soft, '② 소프트웨어 사업 (참고 목록)', '[H] 보호·지원 · [A] 행위 개입 — 이미지 제외')
       + sum + foot;
}

function chapter5() {
  return `
  <section class="chapter">
    <h2 class="h-chapter">별첨 4. 시뮬레이터 처방 사업 목록 <span class="h-sub">진단 지점 기준</span></h2>
    ${_items.length ? rxSplitTables(_items, { amount: true }) : '<p class="bullet">처방된 사업 없음</p>'}
  </section>`;

/* ════════════════════════════════════════════════════════════════════
   ★ 붙임 5. 주요 거점별 진단 카드 (2026-10-20 실무회의 — "붙임 7 구성 변경")
   행정동 단위가 아니라 **밀도 높은 중심지(거점)** 기준으로, 거점마다
     행정동명 · 취약 요인(H/E/A) · 맞춤형 사업 리스트(환경 개선 / 소프트웨어) · 개선 전/후
   를 자동으로 채웁니다. 복합위험지구 밖 지점을 어떻게 쓸지 공무원이 혼란스럽지 않게 개략 예시를 함께 주는 것이 취지.
   거점: data/stats/hotspots.json(+관리자 보정) · 취약 요인: 동별 HEA × 지역안전지수 가중(assets/safety-index.js)
   사업: 연결표의 예비 목록(rules.js fallback, 상위 2분야) · 개선 전/후: 그 거점의 공유 프로젝트(관리자 저장) 또는 지금 진단
   ════════════════════════════════════════════════════════════════════ */
let _regionType = null;      // data/stats/region-types.json — 도심형/도농복합형/농촌형 (10/14 회의 ④)
let _hotspots = [];          // 이 지자체 거점
let _hotShared = {};         // 거점 글자 → 공유 프로젝트 (data 까지)
let _siRegion = null, _weighted = null;
const AURI_AXIS_NAME = { H: 'H 피해대상', E: 'E 환경', A: 'A 행위·관리' };

async function loadHotspotCards(region) {
  try { const r = await fetch('data/stats/hotspots.json'); const all = r.ok ? await r.json() : null; _hotspots = (all && all.regions && all.regions[region]) || []; }
  catch (e) { _hotspots = []; }
  let server = null;
  try { const r = await fetch('/api/hotspots/' + encodeURIComponent(region), { cache: 'no-store' }); if (r.ok) server = await r.json(); } catch (e) { /* 서버 없음 */ }
  if (server) {
    const edits = {}; (server.edits || []).forEach((e) => { edits[e.tag] = e; });
    _hotspots = _hotspots.map((h) => {
      const tag = String.fromCharCode(64 + h.rank), e = edits[tag];
      if (e && e.removed) return null;
      return e && e.lat != null ? Object.assign({}, h, { lat: e.lat, lng: e.lng, moved: true }) : h;
    }).filter(Boolean);
    _hotShared = {}; (server.projects || []).forEach((p) => { _hotShared[p.tag] = p; });
    /* 공유 프로젝트의 개선 전/후 — 거점당 한 건만 (최대 10건) */
    await Promise.all(Object.values(_hotShared).map(async (p) => {
      try { const r = await fetch('/api/projects/' + encodeURIComponent(p.id), { cache: 'no-store' }); if (r.ok) { const j = await r.json(); p.data = (j.project && j.project.data) || {}; } } catch (e) { /* 건너뜀 */ }
    }));
  }
  await AuriSafetyIndex.load();
  _siRegion = AuriSafetyIndex.forRegion(region);
  _weighted = _siRegion && _dongHea ? AuriSafetyIndex.weightDongs(_dongHea, _siRegion) : null;
}

function hotspotPicks(topFields) {
  /* 상위 2분야의 연결표 예비 목록(위험 → 주의 순) → 팔레트 사업. 같은 이름은 한 번만 */
  const picks = [];
  topFields.slice(0, 2).forEach((k) => {
    const fb = (typeof RX_RULES !== 'undefined') && RX_RULES[k] && RX_RULES[k].fallback;
    if (!fb) return;
    (fb.danger || []).concat(fb.caution || []).forEach((name) => {
      const p = AuriPalette.byName(name);
      if (p && !picks.some((x) => x.name === p.name)) picks.push(p);
    });
  });
  return picks;
}

function hotspotCards() {
  const list = _hotspots.slice(0, 10);
  const head = `
  <section class="chapter">
    <h2 class="h-chapter">별첨 5. 주요 거점별 진단 카드 <span class="h-sub">밀도 높은 중심지 기준</span></h2>
    <p class="note-under" style="margin-bottom:10px">* 복합위험지구 밖 지점도 활용할 수 있도록, 119 출동 밀도가 몰린 주요 거점마다 행정동 · 취약 요인(H/E/A) · 맞춤형 사업 · 개선 전/후 예시를 정리합니다.
      거점 = 중점 3분야 밀도의 상위 지점 · 취약 요인 = 동별 HEA(지역안전지수 가중) · 사업 = 분야별 표준 사업 목록.</p>`;
  if (!list.length) return head + '<p class="bullet">이 지자체는 주요 거점 자료가 없습니다.</p></section>';
  const beforeNow = (() => { const b = sessionStorage.getItem('auri_input_image'); return b ? (JSON.parse(b).dataUrl || null) : null; })();
  const label = (k) => AuriSafetyIndex.LABEL[k] || k;
  const cards = list.map((h) => {
    const tag = String.fromCharCode(64 + h.rank);
    const dong = AuriSafetyIndex.dongAt(_dongHea, h.lat, h.lng);
    const wd = dong && _weighted ? _weighted.dongs.find((d) => d.name === dong.name) : null;
    const topFields = Object.keys(h.parts).sort((a, b) => h.parts[b] - h.parts[a]);
    const partsText = topFields.map((k) => `${label(k)} ${Math.round(h.parts[k] * 100)}`).join(' · ');
    let weak = '표본 부족', axes = '';
    if (wd && wd.weak.length) {
      weak = wd.weak.map((a) => AURI_AXIS_NAME[a]).join(' · ');
      axes = ['H', 'E', 'A'].filter((a) => wd.axes[a] != null).map((a) => `${a} ${wd.axes[a]}`).join(' · ') + (wd.totalPct != null ? ` · 가중 종합 ${wd.totalPct}` : '');
    } else if (dong) {
      const s = dong.scores, have = ['H', 'E', 'A'].filter((a) => s[a] != null).sort((a, b) => s[b] - s[a]);
      if (have.length) { weak = AURI_AXIS_NAME[have[0]]; axes = have.map((a) => `${a} ${s[a]}`).join(' · '); }
    }
    const picks = hotspotPicks(topFields);
    const env = picks.filter((p) => p.hea === 'E'), soft = picks.filter((p) => p.hea !== 'E');
    const li = (p) => `<li class="hea-${p.hea}" style="padding:2px 4px"><span class="hea-tag k-${p.hea}">${AuriPalette.heaLabel(p.hea, true)}</span> ${esc(p.name)} <span class="h-sub">${esc(label(p.field))}</span>${AuriPalette.effectLabel(p) ? `<br><span style="font-size:var(--fs-cap);color:var(--g2)">${esc(AuriPalette.effectLabel(p))}</span>` : ''}</li>`;
    const shared = _hotShared[tag];
    const isCurrent = _picked && _picked.hotspot && _picked.hotspot.tag === tag && _picked.hotspot.region === _data.region;
    const before = isCurrent ? beforeNow : (shared && shared.data && shared.data.auri_input_image ? (JSON.parse(shared.data.auri_input_image).dataUrl || null) : null);
    const after = isCurrent ? sessionStorage.getItem('auri_after_image') : (shared && shared.data ? shared.data.auri_after_image || null : null);
    const srcNote = isCurrent ? '지금 진단' : (shared ? `공유 프로젝트 「${esc(shared.title || '')}」 (${esc(shared.owner_name || '관리자')})` : '');
    return `
    <div class="hot-card">
      <table class="tight" style="margin-top:0">
        <tbody>
          <tr><th style="width:14%">거점</th><td style="width:36%"><b>${tag}</b> <span class="h-sub">밀도 ${Math.round(h.score * 100)} · ${h.inside ? '복합위험지구 안' : '복합위험지구 밖'}${h.moved ? ' · 관리자 이동' : ''}</span></td>
              <th style="width:14%">행정동</th><td><b>${dong ? esc(dong.name) : '-'}</b> <span class="h-sub">위도 ${h.lat.toFixed(5)}, 경도 ${h.lng.toFixed(5)}</span></td></tr>
          <tr><th>분야 밀도</th><td>${esc(partsText)}</td><th>취약 요인</th><td><b>${esc(weak)}</b>${axes ? ` <span class="h-sub">${esc(axes)}</span>` : ''}</td></tr>
        </tbody>
      </table>
      <div class="hot-grid">
        <div>
          <p class="bullet" style="font-weight:700;padding-left:0;margin:8px 0 2px">① 환경 개선 사업 <span class="h-sub">[E] 이미지 반영</span></p>
          <ul class="auri-checks">${env.length ? env.map(li).join('') : '<li>해당 없음</li>'}</ul>
          <p class="bullet" style="font-weight:700;padding-left:0;margin:8px 0 2px">② 소프트웨어 사업 <span class="h-sub">[H]·[A] 참고 목록</span></p>
          <ul class="auri-checks">${soft.length ? soft.map(li).join('') : '<li>해당 없음</li>'}</ul>
        </div>
        <div>
          <div class="ba-stack" style="margin:8px 0 0">
            <figure>${before ? `<img src="${before}" alt="개선 전">` : '<div class="slot">개선 전 사진 없음</div>'}<figcaption>개선 전${srcNote ? ' · ' + srcNote : ''}</figcaption></figure>
            <figure>${after ? `<img src="${after}" alt="개선 후">` : '<div class="slot">개선 후 이미지 없음</div>'}<figcaption>개선 후 (사업 반영 예시)</figcaption></figure>
            ${after ? `<div class="ba-disclaimer">${esc(AURI_AI_DISCLAIMER)}</div>` : ''}
          </div>
        </div>
      </div>
    </div>`;
  }).join('');
  return head + cards + '</section>';
}

/* ════════════════════════════════════════════════════════════════════
   현장용 리포트 — 현장에서 볼 것만

   통계 서술은 넣지 않습니다. 현장에서 필요한 것은
   "어디를 · 무엇을 볼 것인가"와 "어떻게 바뀌는가" 입니다.
   ════════════════════════════════════════════════════════════════════ */

function fieldReport() {
  const focusKeys = new Set(_focus.map((f) => f.key));
  const groups = auriFieldChecks(_results, _stats, focusKeys);
  const photos = AuriSitePhoto.all();

  const before = sessionStorage.getItem('auri_input_image');
  const beforeUrl = before ? JSON.parse(before).dataUrl : null;
  const after = sessionStorage.getItem('auri_after_image');

  const risky = _results.filter((r) => r.level.key !== 'lv-safe')
                        .sort((a, b) => b.score - a.score);

  return `
  <section class="chapter">
    <h2 class="h-chapter">현장 확인 리포트</h2>

    <div class="field-head">
      <div class="cell">
        <div class="k">진단 위치</div>

        <div class="s">위도 ${_picked.lat}, 경도 ${_picked.lng}${_picked.dong ? ' · ' + esc(_picked.dong) : ''}</div>

        <div class="k">주의 이상 분야</div>

        <div class="s">${risky.length ? risky.map((r) => `${r.name} ${r.score}점`).join(' · ') : '전 분야 안전 판정'}</div>
      </div>
      <div class="cell">
        <div class="k">확인 항목</div>
        <div class="v">${groups.reduce((n, g) => n + g.items.length, 0)}건</div>

    </div>

    <h3 class="h-section">현장 확인사항</h3>
    ${groups.length ? groups.map((g) => `

          <span class="g-name">${g.label}</span>
          <span class="g-desc">${g.desc}</span>

        <ul>
          ${g.items.map((it) => `

        </ul>
      </div>`).join('') : '<p class="bullet">현장에서 따로 확인할 항목 없음</p>'}

    ${AuriDocEdit.render('field-memo', '(현장 메모)',
      '현장에서 확인한 내용을 적습니다. 사진과 함께 남기면 이후 사업 구상에 쓰입니다.', '')}
  </section>

  <section class="chapter">
    <h2 class="h-chapter">개선 전 · 개선 후</h2>
    <div class="ba-stack">
      <figure>
        ${beforeUrl ? `<img src="${beforeUrl}" alt="개선 전">`
          : '<div class="slot">개선 전 이미지 없음 — 2단계에서 사진을 캡처·업로드하십시오</div>'}
        <figcaption>개선 전 (현황)</figcaption>

      <figure>

          : '<div class="slot">개선 후 이미지 없음 — 4단계에서 생성하십시오</div>'}
        <figcaption>개선 후 (사업 반영)</figcaption>
      </figure>
      <!-- 면책 문구는 개선 전/후 두 장 아래에 **항상** 붙습니다 — 이미지가 아직 없어도,
           인쇄해도 (2026-09-14). 문구는 assets/ui.js 의 AURI_AI_DISCLAIMER 한 곳. -->
      ${afterTagLegend()}
      <div class="ba-disclaimer">${esc(AURI_AI_DISCLAIMER)}</div>
    </div>
  </section>

  <section class="chapter">
    <h2 class="h-chapter">처방 사업 목록</h2>
    ${_items.length ? rxSplitTables(_items, { basis: true }) : '<p class="bullet">처방된 사업 없음</p>'}

    ${photos.length ? `
      <h3 class="h-section">현장 사진</h3>
      <div class="field-pair">
        ${photos.map((p) => `
          <figure>
            <img src="${p.dataUrl}" alt="현장 사진">
            <figcaption>${esc(AuriSitePhoto.caption(p))}${p.note ? '<br>' + esc(p.note) : ''}</figcaption>
          </figure>`).join('')}

}

/* ════════════════════════════════════════════════════════════════════
   현장 사진 관리 (화면 전용) — EXIF 좌표·촬영시각을 읽어 붙입니다
   ════════════════════════════════════════════════════════════════════ */

/* ════════════════════════════════════════════════════════════════════
   문서에 싣는 지도 (2026-09-07)

   ── 왜 지도 화면을 캡처하지 않는가 ─────────────────────────────────
   네이버 지도는 화면에 뜬 것을 이미지로 저장할 수 없습니다. 타일이
   다른 서버에서 오는데 그 서버가 "가져다 써도 된다"는 표시를 붙여 주지
   않아 캔버스가 오염되기 때문입니다. html2canvas 를 써도 같은 곳에서
   막힙니다 (스트리트뷰 캡처가 막힌 것과 같은 이유).

   그래서 **우리가 직접 캔버스에 그립니다.** 배경은 국토교통부 브이월드
   타일을 씁니다 — 공공 서비스이고 가져다 쓰는 것이 허용돼 있으며
   인증키도 필요 없습니다. 자세한 것은 assets/doc-map.js 머리말 참고.
   ════════════════════════════════════════════════════════════════════ */

/* 지도에 찍는 분야 색 — index.html 의 INCIDENT_CATEGORIES 와 같은 값입니다.
   지도에서 본 색과 문서에서 본 색이 달라지면 안 되므로 맞춰 둡니다. */
const MAP_COLORS = {
  suicide: '#7B5EA7', traffic: '#2A78D6', fire: '#E34948', crime: '#E0761F',
  life: '#1BAF7A', industrial: '#8A6D3B', infection: '#4A3AA7',
};

/* 4장 지도가 진단 지점 둘레로 잡는 반경 (m).
   너무 좁으면 점이 몇 개 안 나오고, 너무 넓으면 그 자리가 안 보입니다. */
const MAP_RADIUS_M = 450;

let _incidents = null;                 // data/incidents/<지역>.json
let _heat = null;                      // data/heatmap/index.json — 분야별 밀도 히트맵 (중점 3분야, build-heatmap --focus)
let _auri = null;                      // data/stats/auri-reports/<지역>.json — AURI 사전분석 보고서 원문(구조화)
async function loadAuriReport(region) {
  try { const res = await fetch('data/stats/auri-reports/' + region + '.json'); return res.ok ? await res.json() : null; }
  catch (e) { return null; }
}
const _mapCache = {};                  // 한 번 그린 지도는 다시 그리지 않습니다

async function loadIncidents(region) {
  try {
    const res = await fetch('data/incidents/' + region + '.json');
    if (!res.ok) return null;
    return await res.json();
  } catch (e) {
    return null;                       // 지도가 없어도 문서의 나머지는 그대로 나옵니다
  }
}

/** 분야 하나의 출동 지점을 지도용 점으로 */
function catPoints(key) {
  const set = _incidents && _incidents.categories && _incidents.categories[key];
  if (!set || !set.points) return [];
  return set.points.map(function (p) {
    return { lat: p[0], lng: p[1], weight: p[2], color: MAP_COLORS[key] || '#666666' };
  });
}

/** 어떤 지도를 그릴지 — 3.1 한 장 + 중점분야마다 한 장 */
function heatFor(key) {
  const row = _heat && _heat.regions && _heat.regions[_data.region] && _heat.regions[_data.region].layers && _heat.regions[_data.region].layers[key];
  return row ? { url: 'data/heatmap/' + row.png, bounds: row.bounds } : null;
}

function mapSpecs() {
  if (!_incidents) return [];
  const marker = { lat: Number(_picked.lat), lng: Number(_picked.lng) };
  const out = [{
    id: 'map-survey', w: 1000, h: 620,
    legend: AuriStats.categoryOrder.filter((k) => catPoints(k).length),
    opts: {
      boundary: _data.surveyArea && _data.surveyArea.geometry,
      points: AuriStats.categoryOrder.reduce((a, k) => a.concat(catPoints(k)), []),
      marker: marker,
    },
  }];

  /* 행안부 카드 6. 위치도 — 안전 유형(중점 분야 중 점수 최고) 하나의 밀도 (2026-10-21) */
  const focusKeys = new Set(_focus.map((f) => f.key));
  const prim = _results.slice().sort((a, b) => (focusKeys.has(b.key) - focusKeys.has(a.key)) || b.score - a.score)[0];
  if (prim) out.push({ id: 'map-mois', w: 760, h: 570, opts: { pad: 0.05, focus: { lat: marker.lat, lng: marker.lng, radiusM: MAP_RADIUS_M }, heat: heatFor(prim.key), points: heatFor(prim.key) ? [] : catPoints(prim.key), marker: marker, boundary: _data.surveyArea && _data.surveyArea.geometry } });

  _focus.forEach(function (f) {
    out.push({
      id: 'map-' + f.key, w: 760, h: 570,   // 4:3 — 칸과 비율을 맞춰 잘리지 않게
      opts: {
        /* 여백을 좁게 둡니다. 기본값(12%)이면 한 단계 멀어져 거리가 잘 안 보입니다 */
        pad: 0.05,
        focus: { lat: marker.lat, lng: marker.lng, radiusM: MAP_RADIUS_M },
        /* 2026-10-20: 격자 점 대신 그 분야 밀도 히트맵(강원대 커널밀도). 히트맵이 없는 지자체·분야는 점으로 */
        heat: heatFor(f.key),
        points: heatFor(f.key) ? [] : catPoints(f.key),
        marker: marker,
        boundary: _data.surveyArea && _data.surveyArea.geometry,
      },
    });
  });
  return out;
}

/**
 * 지도를 하나씩 그려 넣습니다.
 * 타일을 받아야 해서 시간이 걸리므로 문서를 먼저 띄우고 뒤따라 채웁니다.
 */
async function renderMaps() {
  for (const spec of mapSpecs()) {
    const img = document.getElementById(spec.id);
    const wait = document.getElementById(spec.id + '-wait');
    if (!img) continue;

    let url = _mapCache[spec.id];
    if (!url) {
      const out = await AuriDocMap.toImage(spec.w, spec.h, spec.opts);
      if (!out) { if (wait) wait.textContent = '지도를 그릴 수 없습니다'; continue; }
      url = _mapCache[spec.id] = out.dataUrl;
    }
    img.src = url;
    img.hidden = false;
    if (wait) wait.remove();

    /* 범례는 색만 보고는 무슨 분야인지 알 수 없어서 붙입니다 */
    const leg = document.getElementById(spec.id + '-legend');
    if (leg && spec.legend) {
      leg.innerHTML = spec.legend.map(function (k) {
        const c = _data.categories[k];
        return '<span><i style="background:' + (MAP_COLORS[k] || '#666') + '"></i>'
             + (c ? c.label : k) + '</span>';
      }).join('') + '<span><i style="background:#000"></i>진단 지점</span>';
    }
  }
}

function photoManager() {
  const photos = AuriSitePhoto.all();
  const opts = _focus.map(function (f, i) {
    return '<option value="' + f.key + '">4.' + (i + 1) + ' ' + f.label + '</option>';
  }).join('');

  return '\n' +
  '<div class="screen-only" style="margin-top:26px; padding-top:18px; border-top:1px solid var(--g1)">' +
    '<div style="display:flex; align-items:center; gap:14px; flex-wrap:wrap">' +
      '<b style="font-size:var(--fs-body)">현장 사진</b>' +
      '<span style="flex:1"></span>' +
      '<label class="btn ghost sm" style="cursor:pointer">사진 추가' +
        '<input type="file" accept="image/*" multiple hidden onchange="onPhotos(this)"></label>' +
    '</div>' +
    '<p style="font-size:var(--fs-cap); color:var(--g2); margin:8px 0 0; line-height:1.7">' +
      '사진의 GPS 좌표와 촬영 시각을 읽어 캡션에 넣습니다. ' +
      '<b>사진을 서버로 보내지 않습니다</b> — 위치와 사람이 찍히므로 브라우저 안에서만 처리합니다.<br>' +
      '카카오톡·메신저로 주고받은 사진은 좌표가 지워져 있습니다. 그때는 <b>지도에서 지정</b>을 누르세요.' +
    '</p>' +
    (photos.length
      ? '<div class="photo-grid">' + photos.map(function (p) {
          const noGps = p.lat === null || p.lng === null;
          return '' +
            '<div class="photo-card">' +
              '<img src="' + p.dataUrl + '" alt="' + esc(p.name) + '">' +
              '<div class="cap' + (noGps ? ' no-gps' : '') + '">' +
                (noGps ? '위치 정보 없음 — 지도에서 지정해 주세요'
                       : esc(AuriSitePhoto.caption(p))) + '</div>' +
              '<select onchange="onPhotoField(\'' + p.id + '\', this.value)">' +
                '<option value="">— 실을 곳 선택 —</option>' +
                opts.replace('value="' + p.field + '"', 'value="' + p.field + '" selected') +
              '</select>' +
              (noGps
                ? '<div class="row"><button type="button" class="btn ghost sm" style="flex:1"' +
                  ' onclick="openMapPick(\'' + p.id + '\')">지도에서 지정</button></div>'
                : '') +
              '<input type="text" placeholder="설명 (선택)" value="' + esc(p.note || '') + '"' +
                ' onchange="AuriSitePhoto.setNote(\'' + p.id + '\', this.value)">' +
              '<button type="button" class="btn-text danger rm" onclick="onPhotoRemove(\'' + p.id + '\')">삭제</button>' +
            '</div>';
        }).join('') + '</div>'
      : '<p style="font-size:var(--fs-cap); color:var(--g2); margin-top:12px">아직 올린 사진이 없습니다.</p>') +
  '</div>';
}

async function onPhotos(input) {
  if (!input.files || !input.files.length) return;
  const before = AuriSitePhoto.all().length;
  await AuriSitePhoto.add(Array.from(input.files));
  input.value = '';

  /* 새로 올린 사진을 사진이 가장 적은 절에 하나씩 배정합니다.
     세 장을 올리면 4.1·4.2·4.3 에 한 장씩 들어갑니다. 물론 바꿀 수 있습니다. */
  const list = AuriSitePhoto.all();
  for (let i = before; i < list.length; i++) {
    const counts = _focus.map(function (f) {
      return { key: f.key, n: AuriSitePhoto.byField(f.key).length };
    }).sort(function (x, y) { return x.n - y.n; });
    if (counts.length) AuriSitePhoto.setField(list[i].id, counts[0].key);
  }
  renderAll();
}

function onPhotoRemove(id) { AuriSitePhoto.remove(id); renderAll(); }
function onPhotoField(id, key) { AuriSitePhoto.setField(id, key || null); renderAll(); }

/* ── 사진 위치를 지도에서 찍기 ─────────────────────────────────────
   좌표가 없는 사진(메신저로 받은 것)에 위치를 붙이는 창입니다.
   지도는 문서에 싣는 것과 같은 방식으로 캔버스에 그리므로, 클릭한
   자리를 그대로 위경도로 되돌릴 수 있습니다 (doc-map 의 toLatLng). */
let _pickMap = null;

async function openMapPick(photoId) {
  const wrap = document.createElement('div');
  wrap.className = 'pick-wrap';
  wrap.innerHTML =
    '<div class="pick-box">' +
      '<div class="hd"><b>사진을 찍은 곳을 지도에서 눌러 주세요</b>' +
        '<span>붉은 점선은 조사지 경계, 십자 표시는 진단 지점입니다.</span></div>' +
      '<canvas id="pickCanvas" width="900" height="560"></canvas>' +
      '<div class="ft">' +
        '<span id="pickHint" style="flex:1; font-size:var(--fs-cap); color:var(--g2); align-self:center"></span>' +
        '<button type="button" class="btn ghost sm" onclick="closeMapPick()">취소</button>' +
      '</div>' +
    '</div>';
  document.body.appendChild(wrap);

  const canvas = document.getElementById('pickCanvas');
  const out = await AuriDocMap.draw(canvas, {
    boundary: _data.surveyArea && _data.surveyArea.geometry,
    marker: { lat: Number(_picked.lat), lng: Number(_picked.lng) },
    points: [],
  });
  if (!out) { closeMapPick(); alert('지도를 그릴 수 없습니다.'); return; }
  _pickMap = out;

  canvas.onclick = function (ev) {
    const r = canvas.getBoundingClientRect();
    /* 캔버스는 CSS 로 줄여 놓았으므로 실제 픽셀로 되돌립니다 */
    const x = (ev.clientX - r.left) * canvas.width / r.width;
    const y = (ev.clientY - r.top) * canvas.height / r.height;
    const ll = _pickMap.toLatLng(x, y);
    AuriSitePhoto.setPosition(photoId, ll.lat, ll.lng);
    closeMapPick();
    renderAll();
  };
}

function closeMapPick() {
  const w = document.querySelector('.pick-wrap');
  if (w) w.remove();
  _pickMap = null;
}

/* ── 탭 ──────────────────────────────────────────────────────────── */
/* ════════════════════════════════════════════════════════════════════
   ★ 수정 모드 (2026-10-21 담당자) — 탭 맨 오른쪽 "✎ 수정" → 보고 있는 문서 전체가 편집 가능(contenteditable).
   저장하면 그 탭의 HTML 을 auri_doc_html 에 남기고(프로젝트 저장에 포함), 다시 열 때 자동 생성 대신 그 HTML 을 씁니다.
   이미지(data:)는 HTML 에 넣지 않고 열쇠(data-imgkey)만 남겼다가 다시 그릴 때 같은 그림을 찾아 넣습니다 — 저장 공간 때문.
   "원래대로" 로 자동 생성 문서로 되돌릴 수 있습니다. 수정 중에는 인쇄·탭 이동이 잠깁니다.
   ════════════════════════════════════════════════════════════════════ */
const DOC_HTML_KEY = 'auri_doc_html';
let _editing = false;
const _imgReg = {};
function imgKey(src) { let h = 0; const step = Math.max(1, Math.floor(src.length / 997)); for (let i = 0; i < src.length; i += step) h = (h * 31 + src.charCodeAt(i)) | 0; return src.length + ':' + (h >>> 0).toString(36); }
function registerImages(root) { root.querySelectorAll('img').forEach((img) => { const v = img.getAttribute('src') || ''; if (v.startsWith('data:')) _imgReg[imgKey(v)] = v; }); }
function loadDocHtml() { try { return JSON.parse(sessionStorage.getItem(DOC_HTML_KEY) || '{}') || {}; } catch (e) { return {}; } }
function saveDocHtml(all) { if (Object.keys(all).length) sessionStorage.setItem(DOC_HTML_KEY, JSON.stringify(all)); else sessionStorage.removeItem(DOC_HTML_KEY); }
function docEl(which) { return document.getElementById('doc' + which.toUpperCase()); }
function currentTab() { return !document.getElementById('docA').hidden ? 'a' : !document.getElementById('docC').hidden ? 'c' : 'b'; }
/** 자동 생성한 뒤 호출 — 저장된 수정본이 있으면 그것으로 바꿔치기 */
function applySavedDoc(which) {
  const el = docEl(which);
  registerImages(el);
  const saved = loadDocHtml()[which];
  if (!saved) return false;
  el.innerHTML = saved;
  el.querySelectorAll('img[data-imgkey]').forEach((img) => { const v = _imgReg[img.dataset.imgkey]; if (v) img.setAttribute('src', v); });
  return true;
}
function setEditUi() {
  const which = currentTab();
  document.getElementById('editBtn').textContent = _editing ? '저장' : '✎ 수정';
  document.getElementById('editBtn').classList.toggle('saving', _editing);
  document.getElementById('editCancel').hidden = !_editing;
  document.getElementById('editReset').hidden = _editing || !loadDocHtml()[which];
  document.getElementById('printBtn').disabled = _editing;
  document.getElementById('printBtn').title = _editing ? '수정을 저장한 뒤 인쇄할 수 있습니다' : '';
  ['tabA', 'tabB', 'tabC'].forEach((id) => { document.getElementById(id).disabled = _editing; });
  const note = document.getElementById('docNoteEdit');
  if (note) note.hidden = !_editing;
}
function toggleEdit() {
  if (_editing) return saveEdit();
  const el = docEl(currentTab());
  _editing = true;
  el.contentEditable = 'true';
  el.classList.add('editing');
  setEditUi();
  el.focus();
}
function saveEdit() {
  const which = currentTab();
  const el = docEl(which);
  el.contentEditable = 'false';
  el.classList.remove('editing');
  /* 입력칸(textarea)의 지금 값을 HTML 에도 반영 — innerHTML 은 처음 값만 들고 있어서 */
  el.querySelectorAll('textarea').forEach((t) => { t.textContent = t.value; });
  const clone = el.cloneNode(true);
  clone.querySelectorAll('img').forEach((img) => { const v = img.getAttribute('src') || ''; if (v.startsWith('data:')) { _imgReg[imgKey(v)] = v; img.dataset.imgkey = imgKey(v); img.removeAttribute('src'); } });
  const all = loadDocHtml();
  all[which] = clone.innerHTML;
  try { saveDocHtml(all); } catch (e) { alert('수정 내용이 너무 커서 브라우저에 저장하지 못했습니다. 화면에는 남아 있지만 다시 열면 사라집니다.'); }
  _editing = false;
  setEditUi();
  AuriDocEdit.refresh();
}
function cancelEdit() {
  _editing = false;
  const el = docEl(currentTab());
  el.contentEditable = 'false';
  el.classList.remove('editing');
  renderAll();          // 저장된 수정본(있으면) 또는 자동 생성으로 되돌림
  setEditUi();
}
function resetEdit() {
  if (!confirm('이 탭의 수정 내용을 모두 버리고 자동 생성 문서로 되돌립니다. 계속할까요?')) return;
  const all = loadDocHtml();
  delete all[currentTab()];
  saveDocHtml(all);
  renderAll();
  setEditUi();
}

function showDoc(which) {
  const a = which === 'a', c = which === 'c';
  document.getElementById('docA').hidden = !a;
  document.getElementById('docB').hidden = a || c;
  document.getElementById('docC').hidden = !c;
  document.getElementById('tabA').classList.toggle('on', a);
  document.getElementById('tabB').classList.toggle('on', !a && !c);
  document.getElementById('tabC').classList.toggle('on', c);
  document.getElementById('printFoot').textContent =
    (a ? '지자체 사전진단서' : c ? '안전사업지구 사전진단 결과 리포트(초안)' : '현장 확인 리포트') + (_data ? ' — ' + _data.label : '');
  document.getElementById('docNoteText').innerHTML = a
    ? 'AURI 「지역 안전진단 사전분석 보고서」와 같은 구조입니다. 1·2장의 글과 표는 AURI 보고서 원문이고, 별첨은 이 앱이 계산한 것입니다. 점선 없는 <b>입력칸</b>은 직접 쓰거나 <b>AI 의견 생성</b>으로 초안을 받을 수 있습니다. AI 초안 표시와 판단 근거는 화면에만 보이고 인쇄물에는 나오지 않습니다.'
    : c
    ? '행안부 「2차 현장보고서」 <b>예시안(공간분석 카드)</b> 구조입니다(10/20 실무회의). 공간유형·세부 유형은 제목 줄을 바로 고칠 수 있고, 사업목적·복합 사업 설명은 입력칸 또는 AI 의견 생성으로 채웁니다. 행안부 양식 원본을 받으면 항목 순서·제목을 그 양식대로 맞춥니다.'
    : '현장에서 볼 것만 담았습니다. 확인사항은 <b>네모 칸에 체크</b>하며 쓰도록 만들었습니다.';
  AuriDocEdit.refresh();
  if (typeof setEditUi === 'function') setEditUi();
}

/* ════════════════════════════════════════════════════════════════════
   행안부 리포트(초안) — 2026-10-16, 10/14 AURI 화상회의 ②

   "우리가 누른 게 보고서로 익스포트가 되면 돼요." (이은석 박사)
   행안부가 직접 적어 보낸 양식(한글 2건)은 아직 저장소에 없습니다. 회의에서 말한 요소만 모았습니다.
     ① 현장 사진(개선 전) + 개선 이미지(개선 후)   ← auri_input_image · auri_after_image
     ② 위험 요인 분석 문장                       ← 4장과 같은 재료 (인적요인·사고유형·물적환경·관련요인)
     ③ 맞춤형 사업 리스트                        ← auri_prescriptions
     ④ 요인별 점수                              ← auri_diagnosis_results (분야 7개)
   현장 확인사항·사전 체크는 넣지 않습니다(회의 결정: 현장 배포용). 잠재 취약성 분석 워딩은 AURI 가 주면 빈칸에 붙입니다.
   ════════════════════════════════════════════════════════════════════ */
function moisReport() {
  /* ★ 2026-10-20 실무회의 — 행안부 「2차 현장보고서」 예시안(붙임 수록) 구조로 재편
     [공간유형 N] 유형 ➤ 위험요인 / 안전 유형·위치·세부 유형·연계 사고데이터 /
     1. 현황 및 공간적 취약요인 상세(사진 + ○ 문제) / 2. 사업목적 / 3. 개선 및 맞춤형 사업 적용 방안(필수 개별사업(E) + 근거 → 복합 맞춤형) /
     4. 예상 소요비용 / 5. 사업 적용 예시(안)(After). 보완(안)의 "복합 분야 진단"은 연계 분야 줄로 넣었습니다. */
  const beforeImg = sessionStorage.getItem('auri_input_image');
  const beforeUrl = beforeImg ? (JSON.parse(beforeImg).dataUrl || null) : null;
  const after = sessionStorage.getItem('auri_after_image');
  const focusKeys = new Set(_focus.map((f) => f.key));
  const ordered = _results.slice().sort((a, b) => (focusKeys.has(b.key) - focusKeys.has(a.key)) || b.score - a.score);
  const primary = ordered[0] || null;                                  // 안전 유형 = 중점 분야 중 점수가 가장 높은 것
  const pKey = primary ? primary.key : null;
  const cat = pKey && _data.categories ? _data.categories[pKey] : null;
  const type = cat ? AuriStats.narrateType(cat, { inside: _stats.inside }) : null;
  const human = cat ? AuriStats.narrateHuman(cat, { inside: _stats.inside }) : null;
  const af = _auri && pKey ? _auri.fields.find((x) => x.key === pKey) : null;
  /* 공간유형 — AURI 보고서의 그 분야 첫 공간유형, 없으면 표준 팔레트(10/21)의 환경개선 사업 대표 공간유형 (10/14 회의: 공간 유형 17개 참고) */
  const spaceDefault = (af && af.groups && af.groups[0] ? af.groups[0].spaceType : '') || (function () {
    const e = _items.find((it) => it.hea === 'E' && AuriPalette.std(it.name)); const sp = e ? AuriPalette.std(e.name) : null; return sp ? sp.spaceType : ''; })();
  const regionType = _regionType ? `${_regionType.type}${_regionType.tags && _regionType.tags.length ? ' · ' + _regionType.tags.join('·') : ''}` : '';
  const linked = ordered.filter((r) => primary && r.key !== primary.key && r.score >= 34);
  /* 문제 항목 — 사진 판독에서 "문제 있음"으로 잡힌 체크리스트 항목 */
  const problems = primary && primary.findings ? primary.findings.filter((f) => f.risk) : [];
  const problemHtml = problems.length
    ? problems.map((f) => `<p class="bullet" style="margin-top:0"><b>(${esc(f.id)})</b> ${esc(f.note || f.ask || '')}</p>`).join('')
    : (primary && primary.observed && primary.observed.length ? primary.observed.map((t) => `<p class="bullet" style="margin-top:0">${esc(t)}</p>`).join('') : '<p class="bullet" style="margin-top:0">사진 판독 결과 없음</p>');
  const env = _items.filter((it) => it.hea === 'E'), soft = _items.filter((it) => it.hea !== 'E');
  const effLine = (it) => { const p = AuriPalette.byName(it.name); const e = AuriPalette.effectLabel(p); return e ? `<p style="margin:2px 0 6px 28px;font-size:var(--fs-sm);color:var(--g3)">→ ${esc(e)}${p && p.source ? ` <span style="color:var(--g2)">(${esc(AuriPalette.sourceShort(p.source))})</span>` : ''}</p>` : ''; };
  /* 비용 */
  let total = 0, unpriced = 0;
  const costRows = _items.map((it) => { const p = AuriPalette.byName(it.name); const a = p ? p.amount : null; if (a && a.won) total += a.won; else unpriced++;
    return `<tr class="${it.hea ? 'hea-' + it.hea : ''}"><td>${esc(it.name)}</td><td><span class="hea-tag k-${it.hea}">${it.hea ? AuriPalette.heaLabel(it.hea, true) : '—'}</span></td><td class="num">${a && a.won ? auriWon(a.won) + (a.unit ? ' / ' + a.unit : '') : (a && a.text ? '산출 근거 필요 — 참고: ' + esc(a.text) : '산출 근거 필요')}</td></tr>`; }).join('');
  const ctx = `지자체 ${_data.label} · 지점 ${_picked.addr || ''} · 안전 유형 ${primary ? primary.name + ' ' + primary.score + '점' : ''} · 연계 분야 ${linked.map((r) => r.name + ' ' + r.score).join(', ')} · 문제 항목 ${problems.map((f) => f.id + ' ' + (f.note || '')).join('; ')} · 사업 ${_items.map((it) => '[' + (it.hea || '-') + '] ' + it.name).join(', ')}`;

  return `
  <section class="chapter mois">
    <p class="h-sub" style="text-align:center;margin:0 0 6px">&lt; 2차 현장보고서 — 공간분석 카드 (행안부 예시안 구조) &gt;</p>
    <div class="mois-title">[공간유형 1] ${AuriDocEdit.inline('mois-space', spaceDefault || '○○ 밀집형', '공간유형 (예: 상업·유흥 밀집형)')} ➤ 위험요인 ① ${AuriDocEdit.inline('mois-risk', problems[0] ? (problems[0].note || problems[0].ask || '') : '', '핵심 위험요인 한 줄')}</div>
    <table class="tight mois-head">
      <tbody>
        <tr><th style="width:13%">안전 유형</th><td style="width:14%"><b>${primary ? esc(primary.name) : '-'}</b>${primary ? `<br><span class="h-sub">${primary.level.label} · ${primary.score}점</span>` : ''}</td>
            <th style="width:9%">위치</th><td style="width:30%">${esc(_picked.addr || '주소 미상')}${_picked.dong ? `<br><span class="h-sub">${esc(_data.shortLabel)} ${esc(_picked.dong)}</span>` : ''}</td>
            <th style="width:11%">세부 유형</th><td>${AuriDocEdit.inline('mois-sub', spaceDefault, '예: 전통시장 일대')}</td></tr>
        <tr><th>연계 사고<br>데이터</th><td colspan="5" style="color:#D83D64">${type ? type.text : (human ? human.text : '119 출동 통계 없음')}</td></tr>
        ${regionType ? `<tr><th>지자체 유형</th><td colspan="5">${esc(regionType)} <span class="h-sub">— ${esc(_regionType.why || '')} (41개 지자체 유형화 1차안, 10/14 회의)</span></td></tr>` : ''}
        ${linked.length ? `<tr><th>복합 분야</th><td colspan="5">${linked.map((r) => `${esc(r.name)} ${r.score}점(${r.level.label})${focusKeys.has(r.key) ? ' <span class="mark-focus">중점</span>' : ''}`).join(' · ')} <span class="h-sub">— 같은 지점에서 주의 이상으로 판독된 다른 분야 (복합 분야 진단)</span></td></tr>` : ''}
      </tbody>
    </table>

    <h3 class="h-section">1. 현황 및 공간적 취약요인 상세</h3>
    <div class="mois-two">
      <figure>${beforeUrl ? `<img src="${beforeUrl}" alt="사진 1">` : '<div class="slot">사진 1 — 현장 사진을 2단계에서 업로드하십시오</div>'}<figcaption>사진 1 — ${esc(_picked.addr || '')}</figcaption></figure>
      <div>${problemHtml}${AuriDocEdit.render('mois-status', '(현황 보완)', '사진에서 보이지 않는 현황·취약요인을 적습니다.', ctx)}</div>
    </div>

    <h3 class="h-section">2. 사업목적</h3>
    ${AuriDocEdit.render('mois-purpose', '○', '사업목적 — AI 의견 생성으로 초안을 받을 수 있습니다.', ctx)}

    <h3 class="h-section">3. 개선 및 맞춤형 사업 적용 방안</h3>
    <p class="bullet" style="font-weight:700;padding-left:0">○ (필수 개별사업)</p>
    ${env.length ? env.map((it) => `<p class="bullet" style="margin-top:2px"><b>(E)</b> ${esc(it.name)}${it.trigger ? `: ${esc(it.trigger.note || it.trigger.ask || '')}` : ''}${it.required ? ' <span class="h-sub">필수</span>' : ''}</p>${effLine(it)}`).join('') : '<p class="bullet">환경 개선 사업 없음</p>'}
    <p class="bullet" style="font-weight:700;padding-left:0;margin-top:10px">○ (복합 맞춤형 사업)</p>
    ${soft.length ? soft.map((it) => `<p class="bullet" style="margin-top:2px"><span class="hea-tag k-${it.hea}">${it.hea ? AuriPalette.heaLabel(it.hea, true) : '—'}</span> ${esc(it.name)}${it.trigger ? `: ${esc(it.trigger.note || '')}` : ''}</p>${effLine(it)}`).join('') : ''}
    ${AuriDocEdit.render('mois-combo', '(복합 맞춤형 사업 설명)', '여러 사업을 한 구간으로 묶는 방안 — 예) 보안등·벽면 도색·바닥 LED 를 선(線) 단위로 정비.', ctx)}
    <p class="note-under">* 환경 개선 사업(E)만 5. 사업 적용 예시 이미지에 반영됩니다. 소프트웨어 사업(H·A)은 참고 목록입니다.</p>

    <h3 class="h-section">4. 예상 소요비용</h3>
    ${_items.length ? `<table class="tight"><thead><tr><th>사업</th><th style="width:12%">개입</th><th class="num" style="width:30%">단가 · 산출 근거</th></tr></thead>
      <tbody>${costRows}</tbody>
      <tfoot><tr class="sum"><td colspan="2">합계 — 총 ${_items.length}종${unpriced ? ` (산출 근거 필요 ${unpriced}종 제외)` : ''}</td><td class="num">${total ? auriWon(total) : '산출 불가'}</td></tr></tfoot></table>
` : '<p class="bullet">○ -</p>'}
    ${AuriDocEdit.render('mois-cost', '○', '소요비용 산출 방식·분담(국비/지방비) 등을 적습니다.', '')}

    <h3 class="h-section">5. 사업 적용 예시(안)</h3>
    <div class="ba-stack">
      <figure>${after ? `<img src="${after}" alt="사진 2 (After)">` : '<div class="slot">사진 2 (After) — 4단계에서 생성하십시오</div>'}<figcaption>사진 2 (After) — 사업 반영 예시</figcaption></figure>
      ${afterTagLegend()}
      <div class="ba-disclaimer">${esc(AURI_AI_DISCLAIMER)}</div>
    </div>

    <h3 class="h-section">6. 위치도 · 마스터플랜(종합도)</h3>
    <!-- 10/14 회의 "마스터플랜·다이어그램도 export 시 함께 표출" — 진단 지점 위치도(그 분야 밀도) + 복합위험지구 맞춤형 사업 종합도 -->
    <div class="mois-two">
      <figure class="doc-map"><img id="map-mois" alt="위치도" hidden><div class="slot" id="map-mois-wait">지도를 그리는 중입니다…</div>
        <figcaption>위치도 — ${primary ? esc(primary.name) : ''} 밀도 · 진단 지점 반경 ${MAP_RADIUS_M}m</figcaption></figure>
      <figure class="doc-map"><img src="data/overview/${esc(_data.region)}.jpg" alt="종합도" style="width:100%;display:block" onerror="this.parentNode.innerHTML='<div class=slot style=min-height:120px>종합도 없음</div>'">
        <figcaption>복합위험지구 중점관리분야 맞춤형 사업 종합도 <span class="h-sub">AURI 사전분석 보고서 기준</span></figcaption></figure>
    </div>
    ${AuriDocEdit.render('mois-remarks', '(검토 의견)', '연구진 검토 의견 — 지역안전지수 하위 등급과의 정합성 등.', ctx)}
  </section>`;
}

/* ★ 개선 이미지 번호 태그 범례 (2026-10-20 실무회의 — 번호만 이미지 안에, 설명은 밖으로)
   4단계에서 "번호 태그" 를 켜고 만들면 auri_after_tags 에 [{n, name}] 이 남습니다. */
function afterTagLegend() {
  let tags = null;
  try { tags = JSON.parse(sessionStorage.getItem('auri_after_tags') || 'null'); } catch (e) { tags = null; }
  if (!tags || !tags.length) return '';
  return `<div class="tag-legend">${tags.map((t) => `<span><b>${t.n}</b> ${esc(t.name)}</span>`).join('')}</div>`;
}

/* ── 그리기 ──────────────────────────────────────────────────────── */
function renderAll() {
  /* 사전진단서 = AURI 보고서 원문 전체(1장 · 2장 · 붙임) + 시뮬레이터 별첨 (2026-10-21: pdf 내용이 다 들어가야 함) */
  document.getElementById('docA').innerHTML =
    cover() + auriCh1() + auriCh2() + auriAppendix() + chapter1() + chapter2() + chapter3() + chapter5() + hotspotCards();
  document.getElementById('docB').innerHTML = fieldReport();
  document.getElementById('docC').innerHTML = moisReport();
  ['a', 'b', 'c'].forEach(applySavedDoc);   // 수정 모드에서 저장한 것이 있으면 그것으로
  AuriDocEdit.refresh();
  /* 지도는 타일을 받아야 해서 시간이 걸립니다. 문서를 먼저 띄우고 뒤따라 채웁니다.
     한 번 그린 것은 _mapCache 에 남아 다시 그리지 않습니다. */
  renderMaps();
}

window.addEventListener('load', async function () {
  /* 물적환경 회귀분석은 7개 지자체에만 있습니다. 없으면 조용히 비고,
     4장의 (물적환경) 줄은 사진 판독만으로 채워집니다. */
  await Promise.all([AuriPalette.load(), AuriPhysical.load()]);

  const loc = sessionStorage.getItem('auri_picked_location');
  const resultsRaw = sessionStorage.getItem('auri_diagnosis_results');
  const rxRaw = sessionStorage.getItem('auri_prescriptions');

  if (!loc || !resultsRaw) {
    document.getElementById('docB').innerHTML =
      '<div class="doc-empty">진단 데이터가 없습니다.<br>위치 선택 → 진단 → 종합 리포트 순서로 진행해 주세요.</div>';
    document.querySelector('.doc-tabs').style.display = 'none';
    return;
  }

  _picked = JSON.parse(loc);
  _results = JSON.parse(resultsRaw);
  _items = rxRaw ? JSON.parse(rxRaw) : [];

  _stats = await AuriStats.load(Number(_picked.lat), Number(_picked.lng));
  _national = await AuriStats.loadNational();
  if (!_stats) {
    document.getElementById('docB').innerHTML =
      '<div class="doc-empty">이 지점의 지자체 통계를 불러오지 못했습니다.</div>';
    return;
  }
  _data = _stats.data;
  _focus = AuriStats.focusCategories(_data);
  _incidents = await loadIncidents(_data.region);   // 지도에 찍을 119 출동 지점
  _dongHea = await AuriDongHea.load(_data.region);  // 3.3 읍면동별 HEA 지표
  _auri = await loadAuriReport(_data.region);       // AURI 사전분석 보고서 (있는 지자체만)
  await loadHotspotCards(_data.region);             // 붙임 5 거점 카드 — 거점 + 공유 프로젝트 + 지역안전지수 가중 (2026-10-20)
  try { const rt = await fetch('data/stats/region-types.json'); const j = rt.ok ? await rt.json() : null; _regionType = j && j.regions ? j.regions.find((r) => r.region === _data.region) || null : null; } catch (e) { _regionType = null; }   // 지자체 유형화 1차안 (10/14)
  try { const hr = await fetch('data/heatmap/index.json'); _heat = hr.ok ? await hr.json() : null; } catch (e) { _heat = null; }
  document.title = `지자체 사전진단서 — ${_data.shortLabel}`;

  renderAll();
  showDoc('b');     // 처음 여는 탭은 현장용 리포트 (2026-09-14)
});
</script>
</body>
</html>
