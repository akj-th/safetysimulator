<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>지자체 사전진단서</title>

<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
/* ════════════════════════════════════════════════════════════════════
   지자체 사전진단서 — AURI 「사전진단서_경기 부천시」 양식

   화면에서는 편집·확인용으로 보고, 인쇄(Ctrl+P)하면 A4 세로 문서가
   그대로 나옵니다. 화면용 요소(상단바·버튼·안내문)는 인쇄에서 빠집니다.
   ════════════════════════════════════════════════════════════════════ */

/* ── 지면 ────────────────────────────────────────────────────────── */
.doc{
  max-width:820px; margin:0 auto; background:var(--w);
  font-size:var(--fs-body); color:var(--g4); line-height:1.85;
}

/* 장(章) — 인쇄할 때 새 쪽에서 시작합니다 */
.chapter{padding:0 0 34px}
.chapter + .chapter{border-top:1px solid var(--g1); padding-top:34px}

.h-chapter{
  font-size:var(--fs-h2); font-weight:700; color:var(--k);
  margin:0 0 20px; padding-bottom:11px; border-bottom:2px solid var(--k);
}
.h-section{
  font-size:var(--fs-lead); font-weight:700; color:var(--k);
  margin:26px 0 12px;
}
.h-sub{
  font-size:var(--fs-body); font-weight:700; color:var(--g4);
  margin:18px 0 8px;
}

/* 원문의 "○ (항목) 내용" 형식 */
.bullet{margin:9px 0 9px 2px; padding-left:19px; position:relative; text-align:justify}
.bullet::before{content:'○'; position:absolute; left:0; color:var(--g2)}
.bullet .tag{font-weight:700; color:var(--k)}
.bullet b{color:var(--k); font-weight:700}
.bullet.dash::before{content:'-'; }
.bullet.dash{margin-left:19px; font-size:var(--fs-sm)}

/* 표 — theme.css 를 따르되 문서용으로 조금 좁게 */
.doc table{width:100%; margin:12px 0 6px}
.doc table.tight th, .doc table.tight td{padding:8px 10px; font-size:var(--fs-sm)}
.doc caption{
  caption-side:top; text-align:left; font-weight:700; color:var(--k);
  font-size:var(--fs-body); padding-bottom:7px;
}
.note-under{font-size:var(--fs-cap); color:var(--g2); line-height:1.7; margin:6px 0 0}

/* 아직 채우지 못한 자리 — 실무자가 현장에서 적습니다 */
.tofill{
  margin:10px 0; padding:12px 15px;
  border:1px dashed var(--g1); background:none;
  font-size:var(--fs-sm); color:var(--g2); line-height:var(--lh-body);
}
.tofill b{color:var(--g3)}
.tofill .why{display:block; margin-top:5px; font-size:var(--fs-cap)}

/* ── 표지 ────────────────────────────────────────────────────────── */
.cover{
  min-height:78vh; display:flex; flex-direction:column;
  align-items:center; justify-content:center; text-align:center; gap:18px;
}
.cover .kicker{font-size:var(--fs-cap); font-weight:700; letter-spacing:.3em; color:var(--g2)}
.cover h1{font-size:42px; font-weight:700; color:var(--k); letter-spacing:-.02em; margin:0; line-height:1.3}
.cover .region{font-size:var(--fs-h2); color:var(--g3); margin:0}
.cover .meta{margin-top:30px; font-size:var(--fs-sm); color:var(--g2); line-height:1.9}
.cover .rule{width:60px; height:2px; background:var(--k)}

/* ── 인쇄 ────────────────────────────────────────────────────────── */
@page{ size:A4 portrait; margin:18mm 16mm 20mm; }

@media print{
  body{background:#fff}
  /* 화면 전용 요소는 인쇄에서 뺍니다 */
  .topbar, .page-head, .picked, .btn, .note, .screen-only{display:none !important}
  .wrap{max-width:none; padding:0}
  .doc{max-width:none; font-size:10.5pt; line-height:1.7}

  .h-chapter{font-size:15pt} .h-section{font-size:12pt} .h-sub{font-size:11pt}
  .cover{min-height:0; height:245mm; page-break-after:always}
  .cover h1{font-size:30pt}

  /* 장마다 새 쪽에서 시작 */
  .chapter{page-break-before:always; border-top:none; padding-top:0}
  .chapter:first-of-type{page-break-before:auto}
  /* 표와 소제목이 쪽 경계에서 잘리지 않게 */
  table, .tofill, .cat-block{page-break-inside:avoid}
  .h-section, .h-sub{page-break-after:avoid}

  th{background:#000 !important; color:#fff !important;
     -webkit-print-color-adjust:exact; print-color-adjust:exact}

  /* 쪽마다 반복되는 바닥글.
     크롬은 position:fixed 요소를 인쇄할 때 모든 쪽에 다시 그립니다.
     쪽 번호는 CSS 로 넣을 수 없어(크롬이 @page 여백 상자를 지원하지 않음)
     브라우저 인쇄 설정의 "머리글/바닥글"을 켜서 씁니다. */
  .print-foot{
    display:block !important;
    position:fixed; bottom:0; left:0; right:0;
    font-size:8.5pt; color:#666;
    border-top:1px solid #ccc; padding-top:2mm;
  }
}
.print-foot{display:none}
</style>
</head>
<body data-step="5">

<header class="topbar" id="topbar"></header>

<main class="wrap">
  <!-- 화면에서만 보이는 안내·버튼 -->
  <div class="page-head screen-only" style="display:flex; align-items:flex-end; justify-content:space-between; gap:20px; max-width:none; flex-wrap:wrap">
    <div style="max-width:720px">
      <h1>지자체 사전진단서</h1>
      <p class="sub">AURI 사전진단서 양식으로 정리합니다. 인쇄(Ctrl+P)하면 A4 세로 문서로 저장됩니다.</p>
    </div>
    <button class="btn ghost" onclick="window.print()">인쇄 / PDF 저장</button>
  </div>

  <p class="note screen-only">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg>
    점선 상자는 <b>현장에서 채우는 자리</b>입니다. 인쇄하면 상단바·버튼·이 안내문은 빠지고 문서만 나옵니다.
    쪽 번호는 브라우저 인쇄 설정에서 <b>머리글/바닥글</b>을 켜면 붙습니다.
  </p>

  <div class="doc" id="doc">
    <!-- 자바스크립트가 채웁니다 -->
    <div class="doc-empty" id="docEmpty" style="display:none"></div>
  </div>

  <!-- 인쇄할 때 쪽마다 반복되는 바닥글 -->
  <div class="print-foot" id="printFoot">지자체 사전진단서</div>
</main>

<script src="assets/ui.js"></script>
<script src="assets/risk-weights.js"></script>
<script src="assets/palette.js"></script>
<script src="assets/stats.js"></script>
<script src="assets/rules.js"></script>
<script>
/* ════════════════════════════════════════════════════════════════════
   사전진단서 만들기

   ── 문장을 규칙으로 만드는 이유 ─────────────────────────────────────
   이 문서는 예산 산출의 근거가 됩니다. AI에게 문장을 쓰게 하면 숫자를
   지어낼 수 있고, 그러면 감사 추적이 깨집니다. 그래서 **증감 패턴에 따라
   문장을 갈라 쓰는 규칙**으로만 만듭니다 (아래 trendSentence 참고).

   ── 어디서 오는가 ───────────────────────────────────────────────────
     1장  전 지자체 공통 고정 문구
     2장  data/stats (연도별 추이 · 반복 발생 지점)
     3장  data/stats (조사지 점유율 · 읍면동)
     4장  사진 AI 판독 + 처방 규칙 엔진 (리포트와 같은 내용)
     5장  팔레트 · 예산 · 개선 전후 이미지
   ════════════════════════════════════════════════════════════════════ */

const YEARS = ['2023', '2024', '2025'];
const esc = (s) => String(s == null ? '' : s)
  .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
const nf = (n) => (n == null ? '—' : Number(n).toLocaleString());

/* ── 2.1 서술 문장 (규칙 기반) ────────────────────────────────────
   증가 / 감소 / 등락 세 갈래로 나눠 씁니다. 원문의 말투를 따랐습니다.

     증가  "2023년 N건에서 2025년 M건으로 지속 증가(X%↑)하며"
     감소  "2023년 N건에서 2025년 M건으로 지속 감소하고 있으나"
     등락  "2023년 N건에서 2024년 M건으로 감소했다가 2025년 K건으로 급증하는 등락"   */
function trendSentence(label, years, ratio) {
  const a = years['2023'] || 0, b = years['2024'] || 0, c = years['2025'] || 0;
  const total = a + b + c;
  const pctChange = a ? Math.round((c - a) / a * 1000) / 10 : null;

  /* 원문처럼 연도를 함께 적습니다 — "2023년 666건에서 2024년 496건으로…" */
  const y1 = `${YEARS[1]}년 ${nf(b)}건`, y2 = `${YEARS[2]}년 ${nf(c)}건`;

  let shape;
  if (a <= b && b <= c && c > a) {
    shape = `${nf(a)}건에서 ${y2}으로 지속 증가(${pctChange}%↑)하며`;
  } else if (a >= b && b >= c && c < a) {
    shape = `${nf(a)}건에서 ${y2}으로 지속 감소(${Math.abs(pctChange)}%↓)하고 있으나`;
  } else if (b < a && c > b) {
    shape = `${nf(a)}건에서 ${y1}으로 감소했다가 ${y2}으로 ${c > a ? '급증' : '반등'}하는 등락을 보이나`;
  } else if (b > a && c < b) {
    shape = `${nf(a)}건에서 ${y1}으로 증가했다가 ${y2}으로 감소하는 등락을 보이나`;
  } else {
    shape = `3개년 ${nf(total)}건으로 뚜렷한 추세 없이 유지되고 있으며`;
  }

  const cmp = ratio === null ? ''
    : ratio >= 1.1 ? ` 3개년 평균 발생 건수는 41개 지자체 평균 대비 <b>${ratio}배</b>로 높은 수준`
    : ratio <= 0.9 ? ` 3개년 평균 발생 건수는 41개 지자체 평균 대비 <b>${ratio}배</b> 수준`
    : ' 3개년 평균 발생 건수는 41개 지자체 평균과 비슷한 수준';

  return `<span class="tag">(${label})</span> ${label} 발생 건수는 ${YEARS[0]}년 ${shape},${cmp}입니다.`;
}

/* ── 1장 — 전 지자체 공통 고정 문구 ─────────────────────────────── */
function chapter1() {
  return `
  <section class="chapter">
    <h2 class="h-chapter">1. 개요</h2>

    <h3 class="h-section">1.1 자료원 및 분석 지표 구성</h3>
    <p class="bullet"><span class="tag">(대상 안전분야)</span>
      교통사고, 화재, 범죄, 생활안전, 산업재해, 자살, 감염병</p>
    <p class="bullet"><span class="tag">(자료원·분석 지표 구성)</span></p>
    <table class="tight">
      <thead><tr>
        <th style="width:22%">구성</th><th style="width:44%">데이터</th><th style="width:34%">활용 목적</th>
      </tr></thead>
      <tbody>
        <tr><td>기초자료</td><td>구급출동 데이터 (’23~’25년)</td>
            <td rowspan="2">지역별 안전분야별<br>복합위험지역 도출</td></tr>
        <tr><td>보조자료</td><td>자살스팟 데이터 · TAAS 데이터</td></tr>
        <tr><td rowspan="3">지자체별 공간자료<br>(2025년 기준)</td>
            <td>인구데이터 (총 인구수, 산업 종사자수)</td>
            <td rowspan="3">복합위험지역의<br>위험 원인 설명</td></tr>
        <tr><td>시설데이터 (의료·교통·복지·안전시설 밀도)</td></tr>
        <tr><td>건축물·도로데이터 (용도, 사용승인일자, 도로폭 등)</td></tr>
      </tbody>
    </table>
    <p class="note-under">※ 본 진단서는 <b>구급출동 데이터(2023~2025년)</b>를 기초자료로 작성했습니다.
      자살스팟·TAAS·인구·건축물 데이터는 미수신 상태이며, 해당 항목은 문서에 그 사실을 적어 두었습니다.</p>

    <h3 class="h-section">1.2 복합위험지역 및 대상지 선정 기준</h3>
    <p class="bullet"><span class="tag">(분야별 복합위험지역 도출)</span>
      인구·종사자 대비 사고 밀집도(상대적 초과위험도) <b>상위 10%</b>를 분야별 복합위험지역으로 추출</p>
    <p class="bullet"><span class="tag">(복합위험지구 중점 대상지 선정)</span>
      분야별 복합위험지역을 공간적으로 중첩하여 다수 위험요소가 집중되는 구역을 최종 사업대상지로 선정</p>
    <table class="tight">
      <thead><tr><th style="width:50%">분야별 복합위험지역 도출</th><th style="width:50%">복합위험지구 중점 대상지 선정</th></tr></thead>
      <tbody><tr>
        <td>사고발생지점 → 안전분야별 복합위험구역(상위 10%) 추출</td>
        <td>안전분야 중첩지역 도출 (복합위험수준이 높은 지역)</td>
      </tr></tbody>
    </table>
  </section>`;
}

/* ── 2장 — 중점관리분야 현황 ────────────────────────────────────── */
function chapter2(data, national, focus) {
  const regionCount = (national && national.regionCount) || 41;

  const rows = focus.map(function (f) {
    const y = f.cat.region.years || {};
    const total = YEARS.reduce((s, k) => s + (y[k] || 0), 0);
    const nat = national && national.categories[f.key];
    const avg = nat ? nat.n / regionCount : null;
    return {
      f: f, y: y, total: total,
      avg: avg ? Math.round(avg) : null,
      ratio: avg ? Number((total / avg).toFixed(2)) : null,
    };
  });

  /* (타 지자체 비교) — 배수를 한 줄로 모읍니다 */
  const cmpLine = rows.filter((r) => r.ratio !== null)
    .map((r) => `${r.f.label} ${r.ratio}배`).join(' · ');
  const high = rows.filter((r) => r.ratio !== null && r.ratio >= 1.1).map((r) => r.f.label);
  const low = rows.filter((r) => r.ratio !== null && r.ratio <= 0.9).map((r) => r.f.label);

  /* 2.2 반복 발생 지점 */
  const repeats = focus.map(function (f) {
    const rp = f.cat.repeat;
    if (!rp) return null;
    return { label: f.label, rp: rp };
  }).filter(Boolean);

  return `
  <section class="chapter">
    <h2 class="h-chapter">2. ${esc(data.shortLabel)} 중점관리분야 현황</h2>

    <h3 class="h-section">2.1 중점관리분야별 사고 발생 일반 현황</h3>
    <p class="bullet"><span class="tag">(중점관리분야)</span>
      공간분석 결과 ${esc(data.label)}의 중점대상지는
      <b>${focus.map((f) => f.label).join('·')}</b> 분야로 도출
      ${data.replaced ? `<br><span style="font-size:var(--fs-sm);color:var(--g2)">※ ${esc(AuriStats.replacedNote(data) || '')}</span>` : ''}</p>

    ${rows.map((r) => `<p class="bullet">${trendSentence(r.f.label, r.y, r.ratio)}</p>`).join('')}

    <p class="bullet"><span class="tag">(타 지자체 비교)</span>
      ${cmpLine ? `41개 지자체 평균 대비 ${cmpLine}로 나타남` : '비교 가능한 값이 없음'}${
        high.length
          ? `. <b>${high.join('·')}</b>${AuriStats.josa(high[high.length - 1], '이', '가')} 평균을 상회`
          : ''}${
        low.length
          ? `, ${low.join('·')}${AuriStats.josa(low[low.length - 1], '은', '는')} 평균 이하`
          : ''}</p>

    <div class="tofill"><b>(소결)</b> — 위 수치를 근거로 한 종합 판단을 적는 자리입니다.
      <span class="why">원문은 "구조적 관리가 필요한 지역으로 판단됨"처럼 정책적 해석을 담습니다.
      수치에서 자동으로 이끌어낼 수 없는 판단이라 비워 두었습니다.</span></div>

    <table class="tight">
      <caption>[표 1] ${esc(data.shortLabel)} 중점관리분야 발생 일반 현황</caption>
      <thead>
        <tr>
          <th rowspan="2" style="width:18%">구분</th>
          <th colspan="3" style="width:33%">연도별 현황 (건)</th>
          <th colspan="3" style="width:49%">발생 건수 비교 (건)</th>
        </tr>
        <tr>
          ${YEARS.map((y) => `<th class="num">${y}</th>`).join('')}
          <th class="num">3개년 합계</th><th class="num">41개 평균</th><th class="num">평균 대비</th>
        </tr>
      </thead>
      <tbody>
        ${rows.map((r) => `
          <tr>
            <td>${r.f.label}</td>
            ${YEARS.map((y) => `<td class="num">${nf(r.y[y] || 0)}</td>`).join('')}
            <td class="num">${nf(r.total)}</td>
            <td class="num">${nf(r.avg)}</td>
            <td class="num">${r.ratio === null ? '—' : r.ratio + '배'}</td>
          </tr>`).join('')}
      </tbody>
    </table>
    <p class="note-under">※ 원문 [표 1]은 <b>인구 10만명당 발생률</b>로 시평균과 비교하나, 인구 데이터를 받지 못해
      <b>41개 지자체 평균 건수</b>와 비교했습니다. 인구 규모가 다른 지자체 간 비교이므로 참고값입니다.<br>
      ※ 연도별 건수는 중복매칭 정리 <b>후</b> 기준입니다. 원문 [표 1]과 분야에 따라 차이가 있습니다(AURI 확인 중).</p>

    <h3 class="h-section">2.2 중점관리분야별 사고 발생 분석 현황</h3>
    ${repeats.length ? repeats.map((r) => `
      <p class="bullet"><span class="tag">(${r.label})</span>
        3개년(’23~’25년) 내 ${esc(data.shortLabel)}에서 <b>${r.rp.threshold}회 이상</b>
        ${r.label}${AuriStats.josa(r.label, '이', '가')}
        반복 발생한 지점은 총 <b>${r.rp.spots.region}개소</b>
        (조사지 내 ${r.rp.spots.inside}개소)로 나타남.
        해당 지점들에서만 ${nf(r.rp.incidents.region)}건이 발생했으며, 한 지점 최다 ${r.rp.maxAtOneSpot}회.
        ${r.rp.topDongs.length
          ? `특히 ${r.rp.topDongs.map((d) => `${d.dong}(${d.spots}개소)`).join(', ')}에 몰려 있음`
          : ''}</p>`).join('')
      : '<p class="bullet">반복 발생 지점을 산출할 자료가 없습니다.</p>'}

    <div class="tofill"><b>(발생 장소의 공간적 특성)</b> — 반복 발생 지점이 어떤 장소인지 적는 자리입니다.
      <span class="why">원문은 "대중교통 거점인 부천역 일대", "부천성모병원 등 대형 의료기관",
      "사적 영역인 공동주택"처럼 <b>건물 용도와 시설명</b>으로 서술합니다.
      우리 자료에는 건축물 용도가 없어(119 자료의 발생장소는 '집·상업시설' 수준) 자동 서술이 불가능합니다.
      현장조사 때 확인해 채워 주세요.</span></div>

    <div class="tofill"><b>(소결)</b> — 분야별 반복 발생 양상을 묶어 정리하는 자리입니다.
      <span class="why">원문은 "역세권·상업지역 범죄예방 환경개선, 고밀 주거지·의료기관 연계 감염병 관리…"처럼
      분야별 대응 방향을 구분해 제시합니다.</span></div>

    <p class="note-under">※ 반복 발생 지점은 <b>지번주소가 같은 곳</b>을 한 지점으로 세었습니다.
      임계값은 분야마다 다르며(원문 기준: 범죄 5회·감염병 2회·자살 3회) <code>REPEAT_THRESHOLD</code>에서 조정합니다.</p>
  </section>`;
}

/* ── 3장 — 안전사고 공간분석 ────────────────────────────────────── */
function chapter3(data, focus, dongName) {
  const order = AuriStats.categoryOrder;
  const focusKeys = new Set(focus.map((f) => f.key));

  const shareRows = order.filter((k) => data.categories[k])
    .map((k) => ({ key: k, c: data.categories[k] }))
    .sort((a, b) => (b.c.count.share || 0) - (a.c.count.share || 0));

  const top = shareRows[0];
  const biggest = shareRows.slice().sort((a, b) => b.c.count.inside - a.c.count.inside)[0];

  /* 3.2 — 이 지점이 속한 동 + 조사지와 겹치는 동들 */
  const dongRows = Object.entries(data.byDong || {})
    .map(([name, d]) => ({ name: name, d: d }))
    .filter((x) => x.d.total.inside > 0)
    .sort((a, b) => b.d.total.inside - a.d.total.inside)
    .slice(0, 8);

  return `
  <section class="chapter">
    <h2 class="h-chapter">3. 안전사고 공간분석</h2>

    <h3 class="h-section">3.1 GIS 기반 사고 밀집지역 도출</h3>
    <p class="bullet">사고 밀집지역인 ${esc(data.shortLabel)} 중점대상지는
      ${biggest ? `<b>${biggest.c.label}</b> 사고 절대 빈도(${nf(biggest.c.count.inside)}건)가 가장 높고,` : ''}
      시 전체 대비 발생비율은
      ${shareRows.slice(0, 2).map((r) => `${r.c.label}(${r.c.count.share}%)`).join(', ')} 순으로 높아 취약</p>

    <table class="tight">
      <caption>[표 2] 안전분야별 사고 분포 및 점유율</caption>
      <thead><tr>
        <th style="width:22%">안전분야</th>
        <th class="num" style="width:20%">시군구 전체 건수</th>
        <th class="num" style="width:20%">조사지 내 건수</th>
        <th class="num" style="width:16%">발생비율(%)</th>
        <th style="width:22%">비고</th>
      </tr></thead>
      <tbody>
        ${shareRows.map((r) => `
          <tr>
            <td>${focusKeys.has(r.key) ? '<b>' + r.c.label + '</b>' : r.c.label}</td>
            <td class="num">${nf(r.c.count.region)}</td>
            <td class="num">${nf(r.c.count.inside)}</td>
            <td class="num">${r.c.count.share === null ? '—' : r.c.count.share}</td>
            <td style="font-size:var(--fs-cap);color:var(--g2)">${
              r.key === 'suicide' ? '정부중점관리대상' :
              focusKeys.has(r.key) ? '중점관리분야' :
              (r.c.sample.reliable ? '' : `표본 ${r.c.count.inside}건`)}</td>
          </tr>`).join('')}
      </tbody>
    </table>
    <p class="note-under">* 자살은 정부중점관리대상으로 발생비율과 관계없이 중점관리분야로 선정</p>

    <div class="tofill"><b>중점대상지 종합위험도 지도</b> — 원문은 여기에 밀집도 지도를 넣습니다.
      <span class="why">1단계 지도 화면에서 캡처해 붙이거나, GIS 히트맵(<code>data/raw/gis_0901/</code>)을 씁니다.</span></div>

    <h3 class="h-section">3.2 읍면동별 사고 발생률</h3>
    ${dongRows.length ? `
      <table class="tight">
        <thead><tr>
          <th style="width:22%">읍면동</th>
          <th class="num" style="width:19%">조사지 내</th>
          <th class="num" style="width:19%">동 전체</th>
          <th style="width:40%">주요 분야 (동 전체 기준)</th>
        </tr></thead>
        <tbody>
          ${dongRows.map((x) => {
            const cats = Object.entries(x.d.categories)
              .sort((a, b) => b[1].count.region - a[1].count.region).slice(0, 3)
              .map(([, c]) => `${c.label} ${nf(c.count.region)}건`).join(', ');
            return `<tr>
              <td>${esc(x.name)}${x.name === dongName ? ' <span style="color:var(--main)">◀ 선택 지점</span>' : ''}</td>
              <td class="num">${nf(x.d.total.inside)}</td>
              <td class="num">${nf(x.d.total.region)}</td>
              <td style="font-size:var(--fs-sm)">${cats}</td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>` : '<p class="bullet">조사지와 겹치는 읍면동 자료가 없습니다.</p>'}

    <div class="tofill"><b>(읍면동별 서술)</b> — 동별 연령·성별 특성과 상권 성격을 적는 자리입니다.
      <span class="why">원문은 "(심곡동) 숙박·상업 및 다세대 주거지 중심 총 136건 발생, 남녀 성비 균등하나
      10~30대 청년·청소년층 집중"처럼 서술합니다. 연령·성별은 <code>byDong</code>에 있으나
      <b>상권 성격은 자료에 없어</b> 현장 확인이 필요합니다.</span></div>
  </section>`;
}

/* ── 4장 — 밀집구간별 사고 원인 및 개선방향 ─────────────────────── */
function chapter4(data, focus, inside, results, items) {
  const opts = { inside: inside };

  const blocks = focus.map(function (f, i) {
    const human = AuriStats.narrateHuman(f.cat, opts);
    const type = AuriStats.narrateType(f.cat, opts);

    /* 물적환경 — 사진 AI 판독 결과 */
    const r = results.find((x) => x.key === f.key);
    const observed = r && r.observed && r.observed.length ? r.observed.join(' · ') : null;
    const findings = r ? (r.findings || []).filter((x) => x.risk) : [];

    /* 맞춤형 사업 — 규칙 엔진이 뽑은 것 중 이 분야 것 */
    const mine = items.filter((it) => it.field === f.key || it.category === f.label);

    /* 현장 확인사항 */
    const checks = [];
    for (const x of findings) checks.push(askToCheck(x.ask));
    for (const c of AuriStats.fieldChecks(f.cat, opts)) checks.push(c);

    return `
      <h3 class="h-section">4.${i + 1} ${f.label}</h3>

      <table class="tight">
        <caption>[표 ${3 + i}] 밀집구간별 사고 원인 및 개선방향 — ${f.label}</caption>
        <tbody>
          <tr>
            <th style="width:18%; vertical-align:top">사고 특성·원인</th>
            <td>
              ${human ? `<p class="bullet" style="margin-top:0"><span class="tag">(인적요인)</span> ${human.text}</p>` : ''}
              ${type ? `<p class="bullet"><span class="tag">(사고유형)</span> ${type.text}</p>` : ''}
              <p class="bullet"><span class="tag">(물적환경)</span> ${
                observed ? esc(observed)
                : (r ? `사진 판독 ${r.level.label} 판정(${r.score}점). 확인된 문제 항목 ${findings.length}건.`
                     : '사진 판독 결과가 없습니다.')}</p>
              ${r && r.level.key === 'lv-safe'
                ? '<p class="bullet" style="color:var(--g2)">사진 판독에서는 이 분야의 뚜렷한 취약 요소가 확인되지 않았습니다.</p>' : ''}
            </td>
          </tr>
          <tr>
            <th style="vertical-align:top">맞춤형 사업</th>
            <td>${mine.length ? mine.map((it) => {
              const p = AuriPalette.byName(it.name);
              const ev = p && p.effect ? p.effect : null;
              return `<p class="bullet" style="margin-top:0">
                <b>${esc(it.name)}</b>
                <span style="font-size:var(--fs-cap);color:var(--g2)"> ${AuriPalette.heaLabel(it.hea, true)} · ${it.priority.label}</span>
                ${ev ? `<br><span style="font-size:var(--fs-sm)">${esc(ev)}</span>` : ''}
                ${p && p.source ? `<br><span style="font-size:var(--fs-cap);color:var(--g2)">출처: ${esc(p.source)}</span>` : ''}
              </p>`;
            }).join('') : '<p class="bullet" style="margin-top:0">처방된 사업이 없습니다.</p>'}</td>
          </tr>
          <tr>
            <th style="vertical-align:top">현장 확인사항</th>
            <td>${checks.length
              ? `<ul style="margin:0; padding-left:18px">${checks.map((c) => `<li>${esc(c)}</li>`).join('')}</ul>`
              : '현장에서 따로 확인할 항목이 없습니다.'}</td>
          </tr>
        </tbody>
      </table>`;
  }).join('');

  return `
  <section class="chapter">
    <h2 class="h-chapter">4. 밀집구간별 사고 원인 및 개선방향</h2>
    <p class="note-under" style="margin-bottom:14px">
      인적요인·사고유형은 119 출동자료 3개년 집계이고, 물적환경은 선택 지점의 거리 이미지 판독 결과입니다.
      맞춤형 사업은 두 근거에서 규칙으로 도출됩니다.</p>
    ${blocks}
    <div class="tofill"><b>밀집도 지도 / 현장 사진</b> — 원문은 분야마다 좌측에 밀집도 지도, 우측에 현장확인사항 사진을 넣습니다.
      <span class="why">현장조사 사진과 지도 캡처를 여기에 붙이면 원문 구성과 같아집니다.</span></div>
  </section>`;
}

/* 체크리스트 질문 → 현장 확인 문장 (리포트와 같은 규칙) */
function askToCheck(ask) {
  if (!ask) return '';
  return String(ask)
    .replace(/인가\??$/, '인지 확인').replace(/있는가\??$/, '있는지 확인')
    .replace(/없는가\??$/, '없는지 확인').replace(/되는가\??$/, '되는지 확인')
    .replace(/막히는가\??$/, '막히는지 확인').replace(/보이는가\??$/, '보이는지 확인')
    .replace(/가\??$/, '지 확인');
}

/* ── 5장 — 부록 ──────────────────────────────────────────────────── */
function chapter5(items, picked, results) {
  let total = 0, unpriced = 0;
  const rows = items.map(function (it) {
    const p = AuriPalette.byName(it.name);
    const a = p ? p.amount : null;
    if (a && a.won) total += a.won; else unpriced++;
    return `
      <tr>
        <td>${esc(it.name)}<br><span style="font-family:var(--mono);font-size:var(--fs-cap);color:var(--g2)">${
          it.custom ? '연구원 직접 추가' : esc(it.id)}</span></td>
        <td>${esc(it.category)}</td>
        <td>${it.hea ? AuriPalette.heaLabel(it.hea) : '—'}</td>
        <td>${it.priority.label}</td>

      </tr>`;
  }).join('');

  const refs = items.map(function (it) {

    return (a && !a.won && a.text) ? `<li><b>${esc(it.name)}</b> — ${esc(a.text)}</li>` : '';
  }).filter(Boolean).join('');

  const before = sessionStorage.getItem('auri_input_image');

  const beforeUrl = before ? JSON.parse(before).dataUrl : null;

  return `
  <section class="chapter">
    <h2 class="h-chapter">5. 부록</h2>

    <h3 class="h-section">5.1 맞춤형 사업 목록 및 사업비</h3>
    ${items.length ? `
      <table class="tight">
        <thead><tr>
          <th style="width:34%">사업 항목</th><th style="width:14%">분야</th>
          <th style="width:18%">개입 유형</th><th style="width:12%">우선순위</th>
          <th class="num" style="width:22%">사업비</th>
        </tr></thead>
        <tbody>${rows}</tbody>
        <tfoot><tr class="sum">
          <td colspan="4">합계 — 총 ${items.length}종${unpriced ? ` (산출 근거 필요 ${unpriced}종 제외)` : ''}</td>
          <td class="num">${total ? auriWon(total) : '산출 불가'}</td>
        </tr></tfoot>
      </table>
      <p class="note-under">AURI 사업 팔레트에 <b>단위와 금액이 분명히 적힌 사업만</b> 금액을 계산했습니다.
        나머지는 지자체 총액·범위·국비 분담 등으로 적혀 있어 격자 단가로 쓸 수 없어 제외했습니다. 부가세 제외.
        ${refs ? `<br>참고로 적힌 금액 문구:<ul style="margin:5px 0 0;padding-left:18px">${refs}</ul>` : ''}</p>`
      : '<p class="bullet">처방된 사업이 없습니다.</p>'}

    <h3 class="h-section">5.2 개선 전 · 개선 후 비교도</h3>
    <div style="display:grid; grid-template-columns:1fr 1fr; gap:16px">
      <figure style="margin:0">
        ${beforeUrl
          ? `<img src="${beforeUrl}" alt="개선 전" style="width:100%; border:1px solid var(--g1)">`
          : '<div class="tofill" style="text-align:center">개선 전 이미지 없음</div>'}
        <figcaption style="text-align:center; font-size:var(--fs-cap); color:var(--g2); margin-top:7px">개선 전 (현황)</figcaption>
      </figure>
      <figure style="margin:0">
        ${after
          ? `<img src="${after}" alt="개선 후" style="width:100%; border:1px solid var(--g1)">`
          : '<div class="tofill" style="text-align:center">개선 후 이미지 없음 — 4단계에서 생성</div>'}
        <figcaption style="text-align:center; font-size:var(--fs-cap); color:var(--g2); margin-top:7px">개선 후 (사업 반영)</figcaption>
      </figure>
    </div>
    <p class="note-under">개선 후 이미지에는 <b>환경적 개입(E)</b>만 반영됩니다.
      교육·단속·상담 등은 거리 사진에 나타나지 않아 목록·사업비에만 남습니다.</p>

    <h3 class="h-section">5.3 진단 근거</h3>
    <table class="tight">
      <thead><tr><th style="width:20%">분야</th><th class="num" style="width:16%">사진 판독</th>
        <th style="width:14%">판정</th><th style="width:50%">판독 근거</th></tr></thead>
      <tbody>
        ${results.map((r) => `<tr>
          <td>${r.name}</td><td class="num">${r.score}점</td>
          <td>${r.level.label}${r.edited ? ' · 연구원 보정' : ''}</td>
          <td style="font-size:var(--fs-sm)">${r.observed && r.observed.length ? esc(r.observed.join(' · ')) : '—'}</td>
        </tr>`).join('')}
      </tbody>
    </table>
    <p class="note-under">대상지 ${esc(picked.addr || '주소 미상')} (위도 ${picked.lat}, 경도 ${picked.lng})</p>
  </section>`;
}

/* ── 표지 ────────────────────────────────────────────────────────── */
function cover(data, picked) {
  const now = new Date();
  const d = `${now.getFullYear()}. ${String(now.getMonth() + 1).padStart(2, '0')}. ${String(now.getDate()).padStart(2, '0')}.`;
  const parts = (data ? data.label : '').split(' ');
  return `
  <section class="cover">
    <div class="kicker">안전사업지구 사업모델 개발 연구용역</div>
    <h1>지자체 사전진단서</h1>
    <div class="rule"></div>
    <p class="region">— ${esc(parts.join(' ') || picked.addr || '대상지')} —</p>
    <div class="meta">
      작성일 ${d}<br>
      자료원 119 구급출동 데이터 (2023~2025년) · 거리 이미지 판독<br>
      건축공간연구원 · Atelier KJ
    </div>
  </section>`;
}

/* ── 페이지 시작 ─────────────────────────────────────────────────── */
window.addEventListener('load', async function () {
  await AuriPalette.load();

  const loc = sessionStorage.getItem('auri_picked_location');
  const resultsRaw = sessionStorage.getItem('auri_diagnosis_results');
  const rxRaw = sessionStorage.getItem('auri_prescriptions');
  const docEl = document.getElementById('doc');

  if (!loc || !resultsRaw) {
    docEl.innerHTML = '<div class="doc-empty">진단 데이터가 없습니다.<br>'
      + '위치 선택 → 진단 → 종합 리포트 순서로 진행해 주세요.</div>';
    return;
  }

  const picked = JSON.parse(loc);
  const results = JSON.parse(resultsRaw);
  const items = rxRaw ? JSON.parse(rxRaw) : [];

  /* 통계는 뒤늦게 도착하므로 먼저 표지·1장을 그려 둡니다 */
  docEl.innerHTML = cover(null, picked) + chapter1();

  const stats = await AuriStats.load(Number(picked.lat), Number(picked.lng));
  const national = await AuriStats.loadNational();
  if (!stats) {
    docEl.innerHTML += '<section class="chapter"><h2 class="h-chapter">2~5. 통계 자료 없음</h2>'
      + '<p class="bullet">이 지점의 지자체 통계를 불러오지 못했습니다.</p></section>';
    return;
  }

  const data = stats.data;
  const focus = AuriStats.focusCategories(data);

  document.getElementById('printFoot').textContent =
    `지자체 사전진단서 — ${data.label}`;
  document.title = `지자체 사전진단서 — ${data.shortLabel}`;

  docEl.innerHTML =
    cover(data, picked)
    + chapter1()
    + chapter2(data, national, focus)
    + chapter3(data, focus, picked.dong)
    + chapter4(data, focus, stats.inside, results, items)
    + chapter5(items, picked, results);
});
</script>
</body>
</html>
