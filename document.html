<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>지자체 사전진단서</title>

<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
/* ════════════════════════════════════════════════════════════════════
   문서 두 종 — 사전진단서 / 현장용 리포트

   AURI 요청으로 문서를 둘로 나눴습니다.
     사전진단서   AURI 양식 그대로. 원문에 없는 요소는 넣지 않습니다
     현장용 리포트 현장에서 볼 것만. 통계 서술은 최소로

   탭으로 오가고, **인쇄하면 지금 보고 있는 문서만** 나옵니다.
   ════════════════════════════════════════════════════════════════════ */

.doc{
  max-width:820px; margin:0 auto; background:var(--w);
  font-size:var(--fs-body); color:var(--g4); line-height:1.85;
}

.chapter{padding:0 0 34px}
.chapter + .chapter{border-top:1px solid var(--g1); padding-top:34px}

.h-chapter{
  font-size:var(--fs-h2); font-weight:700; color:var(--k);
  margin:0 0 20px; padding-bottom:11px; border-bottom:2px solid var(--k);
}
.h-section{font-size:var(--fs-lead); font-weight:700; color:var(--k); margin:26px 0 12px}

/* 원문의 "○ (항목) 내용" 형식 */
.bullet{margin:9px 0 9px 2px; padding-left:19px; position:relative; text-align:justify}
.bullet::before{content:'○'; position:absolute; left:0; color:var(--g2)}
.bullet .tag{font-weight:700; color:var(--k)}
.bullet b{color:var(--k); font-weight:700}

.doc table{width:100%; margin:12px 0 6px}
.doc table.tight th, .doc table.tight td{padding:8px 10px; font-size:var(--fs-sm)}
/* ★ 문서 표 머리행은 옅은 회색입니다 (담당자 확인 2026-09-07).
   전 화면 기본값은 검정 바탕 + 흰 글씨지만(theme.css), 문서는 표가 많아
   검정이 줄줄이 이어지면 화면에서도 인쇄물에서도 너무 강합니다.
   목차 구분은 되면서 잉크를 덜 먹는 정도로 낮춥니다. 이 규칙은 .doc 안에만
   적용되므로 지도·리포트 화면의 표는 그대로입니다. */
.doc th{background:#F5F5F5; color:#000; border-bottom:1px solid var(--g1)}
.doc caption{
  caption-side:top; text-align:left; font-weight:700; color:var(--k);
  font-size:var(--fs-body); padding-bottom:7px;
}
.note-under{font-size:var(--fs-cap); color:var(--g2); line-height:1.7; margin:6px 0 0}

/* ── 표지 ────────────────────────────────────────────────────────── */
.cover{
  min-height:70vh; display:flex; flex-direction:column;
  align-items:center; justify-content:center; text-align:center; gap:18px;
}
.cover .kicker{font-size:var(--fs-cap); font-weight:700; letter-spacing:.3em; color:var(--g2)}
.cover h1{font-size:42px; font-weight:700; color:var(--k); letter-spacing:-.02em; margin:0; line-height:1.3}
.cover .region{font-size:var(--fs-h2); color:var(--g3); margin:0}
.cover .meta{margin-top:30px; font-size:var(--fs-sm); color:var(--g2); line-height:1.9}
.cover .rule{width:60px; height:2px; background:var(--k)}

/* ── 탭 ──────────────────────────────────────────────────────────── */
.doc-tabs{display:flex; gap:0; border-bottom:1px solid var(--g1); margin-bottom:30px}
.doc-tab{
  padding:13px 22px; border:none; background:none; cursor:pointer;
  font-family:inherit; font-size:var(--fs-body); color:var(--g2);
  border-bottom:2px solid transparent; margin-bottom:-1px;
}
.doc-tab.on{color:var(--k); font-weight:700; border-bottom-color:var(--k)}
.doc-tab:hover{color:var(--k)}

/* ── 4장: 좌 지도 / 우 현장사진 (원문 배치) ───────────────────────── */
.field-pair{display:grid; grid-template-columns:1fr 1fr; gap:16px; margin:12px 0 4px}
@media(max-width:700px){ .field-pair{grid-template-columns:1fr} }
.field-pair figure{margin:0}
.field-pair img, .field-pair .slot{
  width:100%; aspect-ratio:4/3; object-fit:cover; display:block;
  border:1px solid var(--g1); background:var(--w);
}
/* 위 display:block 이 hidden 속성보다 세서 그냥 두면 감춰지지 않습니다.
   지도는 다 그려질 때까지 감춰 두어야 하므로 되살립니다. */
img[hidden]{display:none !important}
.field-pair .slot{
  display:flex; align-items:center; justify-content:center; text-align:center;
  padding:18px; font-size:var(--fs-sm); color:var(--g2); line-height:1.7;
}
.field-pair figcaption{
  font-size:var(--fs-cap); color:var(--g2); margin-top:7px; line-height:1.6;
}

/* 사진 목록 (화면 전용 관리 UI) */
/* ── 문서에 싣는 지도 ─────────────────────────────────────────────
   화면에 지도를 띄우는 것이 아니라 캔버스에 그려 그림으로 넣습니다.
   그래야 인쇄와 PDF 에 그대로 남습니다 (assets/doc-map.js 참고). */
/* 한 절에 사진이 두 장 이상일 때 아래에 작게 붙입니다 */
.photo-strip{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; margin:10px 0 4px}
.photo-strip figure{margin:0}
.photo-strip img{width:100%; aspect-ratio:4/3; object-fit:cover; display:block; border:1px solid var(--g1)}
.photo-strip figcaption{font-size:var(--fs-cap); color:var(--g2); margin-top:5px; line-height:1.55}

.doc-map{margin:14px 0 6px}
.doc-map img{width:100%; display:block; border:1px solid var(--g1)}
.doc-map .wait{
  width:100%; aspect-ratio:16/10; border:1px solid var(--g1);
  display:flex; align-items:center; justify-content:center;
  font-size:var(--fs-sm); color:var(--g2); background:var(--w); text-align:center;
}
.doc-map figcaption{
  font-size:var(--fs-cap); color:var(--g2); text-align:center;
  margin-top:7px; line-height:var(--lh-tight);
}
.map-legend{
  display:flex; flex-wrap:wrap; gap:5px 16px; justify-content:center;
  margin-top:7px; font-size:var(--fs-cap); color:var(--g3);
}
.map-legend i{display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:5px}

/* 위치를 지도에서 찍는 창 */
.pick-wrap{
  position:fixed; inset:0; background:rgba(0,0,0,.55); z-index:90;
  display:flex; align-items:center; justify-content:center; padding:24px;
}
.pick-box{background:var(--w); padding:20px; max-width:760px; width:100%}
.pick-box canvas{width:100%; display:block; border:1px solid var(--g1); cursor:crosshair}
.pick-box .hd{display:flex; align-items:center; gap:12px; margin-bottom:12px; flex-wrap:wrap}
.pick-box .hd b{font-size:var(--fs-body)}
.pick-box .hd span{font-size:var(--fs-cap); color:var(--g2)}
.pick-box .ft{display:flex; gap:10px; justify-content:flex-end; margin-top:14px}

.photo-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:14px; margin-top:12px}
.photo-card{border:1px solid var(--g1); padding:9px}
.photo-card img{width:100%; aspect-ratio:4/3; object-fit:cover; display:block}
.photo-card .cap{font-size:var(--fs-cap); color:var(--g2); margin-top:6px; line-height:1.6; word-break:break-all}
.photo-card select, .photo-card input[type=text]{
  width:100%; margin-top:6px; padding:6px 8px; border:1px solid var(--g1);
  font-family:inherit; font-size:var(--fs-cap); background:var(--w); border-radius:0;
}
.photo-card .row{display:flex; gap:6px; margin-top:6px; align-items:center}
.photo-card .cap.no-gps{color:var(--main)}
.photo-card input{margin-top:6px; padding:7px 9px; font-size:var(--fs-cap)}
.photo-card .rm{margin-top:6px}

/* ── 현장용 리포트 ───────────────────────────────────────────────── */
.field-head{
  display:grid; grid-template-columns:repeat(3,1fr); gap:0;
  border-top:1px solid var(--k); border-bottom:1px solid var(--g1);
}
@media(max-width:700px){ .field-head{grid-template-columns:1fr} }
.field-head .cell{padding:14px 18px 14px 0}
.field-head .k{font-size:var(--fs-cap); font-weight:700; letter-spacing:.12em; color:var(--g2)}
.field-head .v{font-size:var(--fs-body); color:var(--k); margin-top:5px; font-weight:700}
.field-head .s{font-size:var(--fs-cap); color:var(--g2); margin-top:3px}

/* 현장 확인사항 — 범주별 */
.chk-group{margin:18px 0}
.chk-group .g-head{
  display:flex; align-items:baseline; gap:10px;
  padding-bottom:7px; border-bottom:1px solid var(--k);
}
.chk-group .g-name{font-size:var(--fs-body); font-weight:700; color:var(--k)}
.chk-group .g-desc{font-size:var(--fs-cap); color:var(--g2)}
.chk-group ul{margin:10px 0 0; padding-left:0; list-style:none}
.chk-group li{
  display:flex; gap:11px; align-items:flex-start;
  padding:9px 0; border-bottom:1px solid var(--g1); line-height:1.7;
}
.chk-group li .box{
  flex:none; width:13px; height:13px; margin-top:5px;
  border:1px solid var(--g2);
}
.chk-group li .tx{flex:1; min-width:0}
.chk-group li .fd{font-size:var(--fs-cap); color:var(--g2); margin-left:7px; white-space:nowrap}

/* 개선 전/후 — 상하로 크게 (좌우로 놓으니 작아서 안 보인다는 의견) */
.ba-stack{margin:14px 0}
.ba-stack figure{margin:0 0 22px}
.ba-stack img{width:100%; display:block; border:1px solid var(--g1); background:var(--w)}
.ba-stack .slot{
  width:100%; aspect-ratio:16/9; border:1px solid var(--g1);
  display:flex; align-items:center; justify-content:center; text-align:center;
  padding:24px; font-size:var(--fs-sm); color:var(--g2);
}
.ba-stack figcaption{
  font-size:var(--fs-cap); font-weight:700; letter-spacing:.12em; color:var(--g2);
  margin-top:9px;
}
/* AI 생성 이미지라는 사실은 인쇄물에도 반드시 남습니다 */
.ba-disclaimer{
  margin-top:7px; padding:9px 12px; border-left:2px solid var(--main);
  font-size:var(--fs-sm); color:var(--g3); line-height:1.7;
}

/* ── 인쇄 ────────────────────────────────────────────────────────── */
@page{ size:A4 portrait; margin:18mm 16mm 20mm; }

@media print{
  body{background:#fff}
  .topbar, .page-head, .picked, .btn, .note, .screen-only, .doc-tabs{display:none !important}
  .wrap{max-width:none; padding:0}
  .doc{max-width:none; font-size:10.5pt; line-height:1.7}
  /* 지금 보고 있는 문서만 인쇄합니다 */
  .doc[hidden]{display:none !important}

  .h-chapter{font-size:15pt} .h-section{font-size:12pt}
  .cover{min-height:0; height:240mm; page-break-after:always}
  .cover h1{font-size:30pt}

  .chapter{page-break-before:always; border-top:none; padding-top:0}
  .chapter:first-of-type{page-break-before:auto}
  table, .field-pair, .chk-group, .ba-stack figure,
  .doc-map, .photo-strip figure{page-break-inside:avoid}
  .h-section{page-break-after:avoid}

  /* 머리행은 옅은 회색 — 검정은 인쇄물에서 너무 튑니다 (담당자 확인 2026-09-07).
     목차 구분은 되면서 잉크를 덜 먹는 정도로 둡니다. */
  th{background:#F5F5F5 !important; color:#000 !important;
     -webkit-print-color-adjust:exact; print-color-adjust:exact}
  /* 개입 유형 배경색은 인쇄에서도 남깁니다 (표에서 유형을 구분하는 장치) */
  .hea-E, .hea-A, .hea-H{-webkit-print-color-adjust:exact; print-color-adjust:exact}

  .print-foot{
    display:block !important;
    position:fixed; bottom:0; left:0; right:0;
    font-size:8.5pt; color:#666;
    border-top:1px solid #ccc; padding-top:2mm;
  }
}
.print-foot{display:none}
</style>
</head>
<body data-step="5">

<header class="topbar" id="topbar"></header>

<main class="wrap">
  <div class="page-head screen-only" style="display:flex; align-items:flex-end; justify-content:space-between; gap:20px; max-width:none; flex-wrap:wrap">
    <div style="max-width:720px">
      <h1>진단 문서</h1>
      <p class="sub">사전진단서는 AURI 양식 그대로, 현장용 리포트는 현장에서 볼 것만 담습니다. 인쇄하면 지금 보고 있는 문서만 나옵니다.</p>
    </div>
    <button class="btn ghost" onclick="window.print()">인쇄 / PDF 저장</button>
  </div>

  <div class="doc-tabs screen-only">
    <button type="button" class="doc-tab on" id="tabA" onclick="showDoc('a')">사전진단서</button>
    <button type="button" class="doc-tab" id="tabB" onclick="showDoc('b')">현장용 리포트</button>
  </div>

  <p class="note screen-only" id="docNote">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg>
    <span id="docNoteText"></span>
  </p>

  <div class="doc" id="docA"></div>
  <div class="doc" id="docB" hidden></div>

  <div class="print-foot" id="printFoot">지자체 사전진단서</div>
</main>

<script src="assets/ui.js"></script>
<script src="assets/risk-weights.js"></script>
<script src="assets/palette.js"></script>
<script src="assets/stats.js"></script>
<script src="assets/rules.js"></script>
<script src="assets/field-check.js"></script>
<script src="assets/doc-edit.js"></script>
<script src="assets/site-photo.js"></script>
<script src="assets/doc-map.js"></script>
<script src="assets/physical.js"></script>
<script>
/* ════════════════════════════════════════════════════════════════════
   문서 만들기

   ── 문장을 규칙으로 만드는 이유 ─────────────────────────────────────
   이 문서는 예산 산출의 근거가 됩니다. AI가 숫자를 지어내면 감사 추적이
   깨지므로, 수치가 들어가는 문장은 **증감 패턴에 따라 갈라 쓰는 규칙**으로만
   만듭니다. AI는 (소결)처럼 **판단이 필요한 자리에서 버튼을 눌렀을 때만**
   초안을 냅니다 (assets/doc-edit.js).
   ════════════════════════════════════════════════════════════════════ */

const YEARS = ['2023', '2024', '2025'];
const esc = (s) => String(s == null ? '' : s)
  .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
const nf = (n) => (n == null ? '—' : Number(n).toLocaleString());

let _data = null, _national = null, _focus = [], _stats = null;
let _results = [], _items = [], _picked = null;

/* ── 2.1 서술 문장 (규칙 기반) ────────────────────────────────────
   증가 / 감소 / 등락 / 보합 네 갈래. 문장은 명사형으로 끝냅니다. */
function trendSentence(label, years, ratio) {
  const a = years['2023'] || 0, b = years['2024'] || 0, c = years['2025'] || 0;
  const total = a + b + c;
  const pct = a ? Math.round((c - a) / a * 1000) / 10 : null;
  const y1 = `${YEARS[1]}년 ${nf(b)}건`, y2 = `${YEARS[2]}년 ${nf(c)}건`;

  let shape, kind, end;
  if (a <= b && b <= c && c > a) {
    kind = 'up'; shape = `${nf(a)}건에서 ${y2}으로 지속 증가(${pct}%↑)`; end = ['하며', '하며'];
  } else if (a >= b && b >= c && c < a) {
    kind = 'down'; shape = `${nf(a)}건에서 ${y2}으로 지속 감소(${Math.abs(pct)}%↓)`; end = ['하고 있으나', '하고 있으며'];
  } else if (b < a && c > b) {
    kind = 'swing'; shape = `${nf(a)}건에서 ${y1}으로 감소했다가 ${y2}으로 ${c > a ? '급증' : '반등'}하는 등락을 보이`; end = ['나', '며'];
  } else if (b > a && c < b) {
    kind = 'swing'; shape = `${nf(a)}건에서 ${y1}으로 증가했다가 ${y2}으로 감소하는 등락을 보이`; end = ['나', '며'];
  } else {
    kind = 'flat'; shape = `3개년 ${nf(total)}건으로 뚜렷한 추세 없이 유지되고 있`; end = ['으나', '으며'];
  }
  shape += (ratio !== null && ratio >= 1.1) ? end[0] : end[1];

  /* "추세와 무관하게"는 감소·등락인데도 평균보다 높을 때만 붙입니다 */
  const despite = (kind === 'down' || kind === 'swing') ? '추세와 무관하게 ' : '';
  const much = ratio >= 2 ? '크게 ' : '';
  const cmp = ratio === null ? ' 비교 가능한 평균값 없음'
    : ratio >= 1.1 ? ` 3개년 발생 건수는 41개 지자체 평균 대비 <b>${ratio}배</b>로 ${despite}평균을 ${much}상회`
    : ratio <= 0.9 ? ` 3개년 발생 건수는 41개 지자체 평균 대비 <b>${ratio}배</b>로 평균 이하 수준`
    : ' 3개년 발생 건수는 41개 지자체 평균과 비슷한 수준';

  return `<span class="tag">(${label})</span> ${label} 발생 건수는 ${YEARS[0]}년 ${shape},${cmp}`;
}

/* ════════════════════════════════════════════════════════════════════
   사전진단서 — AURI 양식 그대로
   표지 / 1.개요 / 2.중점관리분야 / 3.공간분석 / 4.밀집구간별 / 5.부록
   ════════════════════════════════════════════════════════════════════ */

function cover() {
  const now = new Date();
  const d = `${now.getFullYear()}. ${String(now.getMonth() + 1).padStart(2, '0')}. ${String(now.getDate()).padStart(2, '0')}.`;
  return `
  <section class="cover">
    <div class="kicker">안전사업지구 사업모델 개발 연구용역</div>
    <h1>지자체 사전진단서</h1>
    <div class="rule"></div>
    <p class="region">— ${esc(_data ? _data.label : (_picked.addr || '대상지'))} —</p>
    <div class="meta">
      작성일 ${d}<br>
      자료원 119 구급출동 데이터 (2023~2025년)<br>
      건축공간연구원 · Atelier KJ
    </div>
  </section>`;
}

function chapter1() {
  return `
  <section class="chapter">
    <h2 class="h-chapter">1. 개요</h2>

    <h3 class="h-section">1.1 자료원 및 분석 지표 구성</h3>
    <p class="bullet"><span class="tag">(대상 안전분야)</span>
      교통사고, 화재, 범죄, 생활안전, 산업재해, 자살, 감염병</p>
    <p class="bullet"><span class="tag">(자료원·분석 지표 구성)</span></p>
    <table class="tight">
      <thead><tr>
        <th style="width:22%">구성</th><th style="width:44%">데이터</th><th style="width:34%">활용 목적</th>
      </tr></thead>
      <tbody>
        <tr><td>기초자료</td><td>구급출동 데이터 (’23~’25년)</td>

function chapter2() {
  const count = (_national && _national.regionCount) || 41;
  const rows = _focus.map(function (f) {
    const y = f.cat.region.years || {};

    const nat = _national && _national.categories[f.key];
    const avg = nat ? nat.n / count : null;
    return { f, y, total, avg: avg ? Math.round(avg) : null, ratio: avg ? Number((total / avg).toFixed(2)) : null };
  });

  const high = rows.filter((r) => r.ratio !== null && r.ratio >= 1.1).map((r) => r.f.label);
  const low = rows.filter((r) => r.ratio !== null && r.ratio <= 0.9).map((r) => r.f.label);
  const cmpLine = rows.filter((r) => r.ratio !== null).map((r) => `${r.f.label} ${r.ratio}배`).join(' · ');

  /* AI 초안에 넘길 자료 — 화면에 보이는 수치를 그대로 문자열로 */

중점관리분야: ${_focus.map((f) => f.label).join(', ')}
` + rows.map((r) => `${r.f.label}: ${YEARS.map((y) => y + '년 ' + (r.y[y] || 0) + '건').join(', ')}`

  const repeats = _focus.map((f) => (f.cat.repeat ? { label: f.label, rp: f.cat.repeat } : null)).filter(Boolean);
  const ctx22 = repeats.map((r) =>

    + `반복 지점 발생 ${r.rp.incidents.region}건, 한 지점 최다 ${r.rp.maxAtOneSpot}회, `
    + `집중 읍면동 ${r.rp.topDongs.map((d) => d.dong + ' ' + d.spots + '개소').join(', ')}`).join('\n');

  return `

    <h2 class="h-chapter">2. ${esc(_data.shortLabel)} 중점관리분야 현황</h2>

    <h3 class="h-section">2.1 중점관리분야별 사고 발생 일반 현황</h3>
    <p class="bullet"><span class="tag">(중점관리분야)</span>

      <b>${_focus.map((f) => f.label).join('·')}</b> 분야로 도출</p>

    ${rows.map((r) => `<p class="bullet">${trendSentence(r.f.label, r.y, r.ratio)}</p>`).join('')}

    <p class="bullet"><span class="tag">(타 지자체 비교)</span>
      ${cmpLine ? `41개 지자체 평균 대비 ${cmpLine}로 나타남` : '비교 가능한 값이 없음'}${
        high.length ? `. <b>${high.join('·')}</b>${AuriStats.josa(high[high.length - 1], '이', '가')} 평균을 상회` : ''}${
        low.length ? `, ${low.join('·')}${AuriStats.josa(low[low.length - 1], '은', '는')} 평균 이하` : ''}</p>

    ${AuriDocEdit.render('c2-sum', '(소결)',
      '위 수치를 근거로 한 종합 판단을 적습니다. 예) 구조적 관리가 필요한 지역으로 판단됨 — 분야별 관리 방향 포함',
      ctx2)}

    <table class="tight">

      <thead>
        <tr>
          <th rowspan="2" style="width:18%">구분</th>

          <th colspan="3" style="width:49%">발생 건수 비교 (건)</th>
        </tr>
        <tr>
          ${YEARS.map((y) => `<th class="num">${y}</th>`).join('')}

        해당 지점에서만 ${nf(r.rp.incidents.region)}건이 발생했으며 한 지점 최다 ${r.rp.maxAtOneSpot}회.
        ${r.rp.topDongs.length ? `특히 ${r.rp.topDongs.map((d) => `${d.dong}(${d.spots}개소)`).join(', ')}에 집중` : ''}</p>`).join('')

      '')}

    ${AuriDocEdit.render('c2-sum2', '(소결)',
      '분야별 반복 발생 양상을 묶어 정리합니다. 예) 역세권·상업지역 범죄예방 환경개선, 고밀 주거지·의료기관 연계 감염병 관리',
      ctx22)}
  </section>`;
}

function chapter3() {

    .sort((a, b) => (b.c.count.share || 0) - (a.c.count.share || 0));
  const biggest = shareRows.slice().sort((a, b) => b.c.count.inside - a.c.count.inside)[0];

  const dongRows = Object.entries(_data.byDong || {})
    .map(([name, d]) => ({ name, d }))
    .filter((x) => x.d.total.inside > 0)
    .sort((a, b) => b.d.total.inside - a.d.total.inside)
    .slice(0, 8);

  const ctx3 = shareRows.map((r) =>
    `${r.c.label}: 시군구 전체 ${r.c.count.region}건, 조사지 내 ${r.c.count.inside}건, 발생비율 ${r.c.count.share}%`).join('\n');
  const ctxDong = dongRows.map((x) => {

  return `

    <h2 class="h-chapter">3. 안전사고 공간분석</h2>

    <h3 class="h-section">3.1 GIS 기반 사고 밀집지역 도출</h3>

      <div class="map-legend" id="map-survey-legend"></div>
      <figcaption>[그림 1] ${esc(_data.shortLabel)} 중점대상지 종합위험도 —
        조사지 경계(붉은 점선)와 119 출동 지점(2023~2025)</figcaption>
    </figure>

    <table class="tight">
      <caption>[표 2] 안전분야별 사고 분포 및 점유율</caption>
      <thead><tr>
        <th style="width:22%">안전분야</th>
        <th class="num" style="width:20%">시군구 전체 건수</th>
        <th class="num" style="width:20%">조사지 내 건수</th>
        <th class="num" style="width:16%">발생비율(%)</th>
        <th style="width:22%">비고</th>
      </tr></thead>
      <tbody>
        ${shareRows.map((r) => `
          <tr>
            <td>${focusKeys.has(r.key) ? '<b>' + r.c.label + '</b>' : r.c.label}</td>
            <td class="num">${nf(r.c.count.region)}</td>
            <td class="num">${nf(r.c.count.inside)}</td>
            <td class="num">${r.c.count.share === null ? '—' : r.c.count.share}</td>
            <td style="font-size:var(--fs-cap);color:var(--g2)">${
              r.key === 'suicide' ? '정부중점관리대상' : (focusKeys.has(r.key) ? '중점관리분야' : '')}</td>
          </tr>`).join('')}
      </tbody>
    </table>
    <p class="note-under">* 자살은 정부중점관리대상으로 발생비율과 관계없이 중점관리분야로 선정</p>

    <h3 class="h-section">3.2 읍면동별 사고 발생률</h3>

      ctxDong)}

/* 4장 — 원문처럼 분야마다 [좌: 지도 / 우: 현장 사진] + 3행 표 */
function chapter4() {

  const blocks = _focus.map(function (f, i) {
    const opts = { inside: _stats.inside };
    const human = AuriStats.narrateHuman(f.cat, opts);
    const type = AuriStats.narrateType(f.cat, opts);
    const r = _results.find((x) => x.key === f.key);
    const observed = r && r.observed && r.observed.length ? r.observed.join(' · ') : null;

    /* 물적환경 회귀분석 — 7개 지자체에만 있습니다.
       조사지 내에 유의한 요인이 없으면 지자체 전체 결과로 대신하고,
       어느 쪽인지는 문장 앞머리에 그대로 적힙니다. */
    const phys = AuriPhysical.narrate(_data.region, f.key, {
      catLabel: f.label, fallback: true, limit: 4,
    });
    const mine = _items.filter((it) => it.field === f.key || it.category === f.label);
    /* 이 절에 배정된 사진. 여러 장이면 첫 장을 크게 싣고 나머지는 아래에 붙입니다 */

          <figcaption>${photo ? esc(AuriSitePhoto.caption(photo)) + (photo.note ? ' — ' + esc(photo.note) : '') : '현장확인사항'}</figcaption>
        </figure>
      </div>

      ${extra.length ? `<div class="photo-strip">${extra.map(function (p) {
        return `<figure><img src="${p.dataUrl}" alt="현장 사진">
          <figcaption>${esc(AuriSitePhoto.caption(p))}${p.note ? ' — ' + esc(p.note) : ''}</figcaption></figure>`;
      }).join('')}</div>` : ''}

      <table class="tight">
        <caption>[표 ${3 + i}] 밀집구간별 사고 원인 및 개선방향 — ${f.label}</caption>

          <tr>
            <th style="width:18%; vertical-align:top">사고 특성·원인</th>
            <td>
              ${human ? `<p class="bullet" style="margin-top:0"><span class="tag">(인적요인)</span> ${human.text}</p>` : ''}
              ${type ? `<p class="bullet"><span class="tag">(사고유형)</span> ${type.text}</p>` : ''}
              <p class="bullet"><span class="tag">(물적환경)</span> ${
                observed ? esc(observed)
                : (r ? `사진 판독 ${r.level.label} 판정(${r.score}점)` : '사진 판독 결과 없음')}</p>
              ${phys ? `<p class="bullet"><span class="tag">(관련요인)</span> ${esc(phys.text)}
                <br><span style="font-size:var(--fs-cap);color:var(--g2)">${esc(phys.basis)} · 출처: ${esc(AuriPhysical.source())}</span></p>` : ''}

              const p = AuriPalette.byName(it.name);
              return `<p class="bullet ${it.hea ? 'hea-' + it.hea : ''}" style="margin-top:0; padding:6px 8px 6px 25px">

    ${blocks}

  return `

      <p class="note-under">
        * 개입 유형 — <span class="hea-tag k-H">[H] 피해대상</span> 보호·지원 ·
        <span class="hea-tag k-E">[E] 환경</span> 개선 ·

      : '<p class="bullet">처방된 사업 없음</p>'}

}

/* ════════════════════════════════════════════════════════════════════
   현장 사진 관리 (화면 전용) — EXIF 좌표·촬영시각을 읽어 붙입니다
   ════════════════════════════════════════════════════════════════════ */

/* ════════════════════════════════════════════════════════════════════
   문서에 싣는 지도 (2026-09-07)

   ── 왜 지도 화면을 캡처하지 않는가 ─────────────────────────────────
   네이버 지도는 화면에 뜬 것을 이미지로 저장할 수 없습니다. 타일이
   다른 서버에서 오는데 그 서버가 "가져다 써도 된다"는 표시를 붙여 주지
   않아 캔버스가 오염되기 때문입니다. html2canvas 를 써도 같은 곳에서
   막힙니다 (스트리트뷰 캡처가 막힌 것과 같은 이유).

   그래서 **우리가 직접 캔버스에 그립니다.** 배경은 국토교통부 브이월드
   타일을 씁니다 — 공공 서비스이고 가져다 쓰는 것이 허용돼 있으며
   인증키도 필요 없습니다. 자세한 것은 assets/doc-map.js 머리말 참고.
   ════════════════════════════════════════════════════════════════════ */

/* 지도에 찍는 분야 색 — index.html 의 INCIDENT_CATEGORIES 와 같은 값입니다.
   지도에서 본 색과 문서에서 본 색이 달라지면 안 되므로 맞춰 둡니다. */
const MAP_COLORS = {
  suicide: '#7B5EA7', traffic: '#2A78D6', fire: '#E34948', crime: '#E0761F',
  life: '#1BAF7A', industrial: '#8A6D3B', infection: '#4A3AA7',
};

/* 4장 지도가 진단 지점 둘레로 잡는 반경 (m).
   너무 좁으면 점이 몇 개 안 나오고, 너무 넓으면 그 자리가 안 보입니다. */
const MAP_RADIUS_M = 450;

let _incidents = null;                 // data/incidents/<지역>.json
const _mapCache = {};                  // 한 번 그린 지도는 다시 그리지 않습니다

async function loadIncidents(region) {
  try {
    const res = await fetch('data/incidents/' + region + '.json');
    if (!res.ok) return null;
    return await res.json();
  } catch (e) {
    return null;                       // 지도가 없어도 문서의 나머지는 그대로 나옵니다
  }
}

/** 분야 하나의 출동 지점을 지도용 점으로 */
function catPoints(key) {
  const set = _incidents && _incidents.categories && _incidents.categories[key];
  if (!set || !set.points) return [];
  return set.points.map(function (p) {
    return { lat: p[0], lng: p[1], weight: p[2], color: MAP_COLORS[key] || '#666666' };
  });
}

/** 어떤 지도를 그릴지 — 3.1 한 장 + 중점분야마다 한 장 */
function mapSpecs() {
  if (!_incidents) return [];
  const marker = { lat: Number(_picked.lat), lng: Number(_picked.lng) };
  const out = [{
    id: 'map-survey', w: 1000, h: 620,
    legend: AuriStats.categoryOrder.filter((k) => catPoints(k).length),
    opts: {
      boundary: _data.surveyArea && _data.surveyArea.geometry,
      points: AuriStats.categoryOrder.reduce((a, k) => a.concat(catPoints(k)), []),
      marker: marker,
    },
  }];

  _focus.forEach(function (f) {
    out.push({
      id: 'map-' + f.key, w: 760, h: 570,   // 4:3 — 칸과 비율을 맞춰 잘리지 않게
      opts: {
        /* 여백을 좁게 둡니다. 기본값(12%)이면 한 단계 멀어져 거리가 잘 안 보입니다 */
        pad: 0.05,
        focus: { lat: marker.lat, lng: marker.lng, radiusM: MAP_RADIUS_M },
        points: catPoints(f.key),
        marker: marker,
        boundary: _data.surveyArea && _data.surveyArea.geometry,
      },
    });
  });
  return out;
}

/**
 * 지도를 하나씩 그려 넣습니다.
 * 타일을 받아야 해서 시간이 걸리므로 문서를 먼저 띄우고 뒤따라 채웁니다.
 */
async function renderMaps() {
  for (const spec of mapSpecs()) {
    const img = document.getElementById(spec.id);
    const wait = document.getElementById(spec.id + '-wait');
    if (!img) continue;

    let url = _mapCache[spec.id];
    if (!url) {
      const out = await AuriDocMap.toImage(spec.w, spec.h, spec.opts);
      if (!out) { if (wait) wait.textContent = '지도를 그릴 수 없습니다'; continue; }
      url = _mapCache[spec.id] = out.dataUrl;
    }
    img.src = url;
    img.hidden = false;
    if (wait) wait.remove();

    /* 범례는 색만 보고는 무슨 분야인지 알 수 없어서 붙입니다 */
    const leg = document.getElementById(spec.id + '-legend');
    if (leg && spec.legend) {
      leg.innerHTML = spec.legend.map(function (k) {
        const c = _data.categories[k];
        return '<span><i style="background:' + (MAP_COLORS[k] || '#666') + '"></i>'
             + (c ? c.label : k) + '</span>';
      }).join('') + '<span><i style="background:#000"></i>진단 지점</span>';
    }
  }
}

function photoManager() {
  const photos = AuriSitePhoto.all();
  const opts = _focus.map(function (f, i) {
    return '<option value="' + f.key + '">4.' + (i + 1) + ' ' + f.label + '</option>';
  }).join('');

  return '\n' +
  '<div class="screen-only" style="margin-top:26px; padding-top:18px; border-top:1px solid var(--g1)">' +
    '<div style="display:flex; align-items:center; gap:14px; flex-wrap:wrap">' +
      '<b style="font-size:var(--fs-body)">현장 사진</b>' +
      '<span style="flex:1"></span>' +
      '<label class="btn ghost sm" style="cursor:pointer">사진 추가' +
        '<input type="file" accept="image/*" multiple hidden onchange="onPhotos(this)"></label>' +
    '</div>' +
    '<p style="font-size:var(--fs-cap); color:var(--g2); margin:8px 0 0; line-height:1.7">' +
      '사진의 GPS 좌표와 촬영 시각을 읽어 캡션에 넣습니다. ' +
      '<b>사진을 서버로 보내지 않습니다</b> — 위치와 사람이 찍히므로 브라우저 안에서만 처리합니다.<br>' +
      '카카오톡·메신저로 주고받은 사진은 좌표가 지워져 있습니다. 그때는 <b>지도에서 지정</b>을 누르세요.' +
    '</p>' +
    (photos.length
      ? '<div class="photo-grid">' + photos.map(function (p) {
          const noGps = p.lat === null || p.lng === null;
          return '' +
            '<div class="photo-card">' +
              '<img src="' + p.dataUrl + '" alt="' + esc(p.name) + '">' +
              '<div class="cap' + (noGps ? ' no-gps' : '') + '">' +
                (noGps ? '위치 정보 없음 — 지도에서 지정해 주세요'
                       : esc(AuriSitePhoto.caption(p))) + '</div>' +
              '<select onchange="onPhotoField(\'' + p.id + '\', this.value)">' +
                '<option value="">— 실을 곳 선택 —</option>' +
                opts.replace('value="' + p.field + '"', 'value="' + p.field + '" selected') +
              '</select>' +
              (noGps
                ? '<div class="row"><button type="button" class="btn ghost sm" style="flex:1"' +
                  ' onclick="openMapPick(\'' + p.id + '\')">지도에서 지정</button></div>'
                : '') +
              '<input type="text" placeholder="설명 (선택)" value="' + esc(p.note || '') + '"' +
                ' onchange="AuriSitePhoto.setNote(\'' + p.id + '\', this.value)">' +
              '<button type="button" class="btn-text danger rm" onclick="onPhotoRemove(\'' + p.id + '\')">삭제</button>' +
            '</div>';
        }).join('') + '</div>'
      : '<p style="font-size:var(--fs-cap); color:var(--g2); margin-top:12px">아직 올린 사진이 없습니다.</p>') +
  '</div>';
}

async function onPhotos(input) {
  if (!input.files || !input.files.length) return;
  const before = AuriSitePhoto.all().length;
  await AuriSitePhoto.add(Array.from(input.files));
  input.value = '';

  /* 새로 올린 사진을 사진이 가장 적은 절에 하나씩 배정합니다.
     세 장을 올리면 4.1·4.2·4.3 에 한 장씩 들어갑니다. 물론 바꿀 수 있습니다. */
  const list = AuriSitePhoto.all();
  for (let i = before; i < list.length; i++) {
    const counts = _focus.map(function (f) {
      return { key: f.key, n: AuriSitePhoto.byField(f.key).length };
    }).sort(function (x, y) { return x.n - y.n; });
    if (counts.length) AuriSitePhoto.setField(list[i].id, counts[0].key);
  }
  renderAll();
}

function onPhotoRemove(id) { AuriSitePhoto.remove(id); renderAll(); }
function onPhotoField(id, key) { AuriSitePhoto.setField(id, key || null); renderAll(); }

/* ── 사진 위치를 지도에서 찍기 ─────────────────────────────────────
   좌표가 없는 사진(메신저로 받은 것)에 위치를 붙이는 창입니다.
   지도는 문서에 싣는 것과 같은 방식으로 캔버스에 그리므로, 클릭한
   자리를 그대로 위경도로 되돌릴 수 있습니다 (doc-map 의 toLatLng). */
let _pickMap = null;

async function openMapPick(photoId) {
  const wrap = document.createElement('div');
  wrap.className = 'pick-wrap';
  wrap.innerHTML =
    '<div class="pick-box">' +
      '<div class="hd"><b>사진을 찍은 곳을 지도에서 눌러 주세요</b>' +
        '<span>붉은 점선은 조사지 경계, 십자 표시는 진단 지점입니다.</span></div>' +
      '<canvas id="pickCanvas" width="900" height="560"></canvas>' +
      '<div class="ft">' +
        '<span id="pickHint" style="flex:1; font-size:var(--fs-cap); color:var(--g2); align-self:center"></span>' +
        '<button type="button" class="btn ghost sm" onclick="closeMapPick()">취소</button>' +
      '</div>' +
    '</div>';
  document.body.appendChild(wrap);

  const canvas = document.getElementById('pickCanvas');
  const out = await AuriDocMap.draw(canvas, {
    boundary: _data.surveyArea && _data.surveyArea.geometry,
    marker: { lat: Number(_picked.lat), lng: Number(_picked.lng) },
    points: [],
  });
  if (!out) { closeMapPick(); alert('지도를 그릴 수 없습니다.'); return; }
  _pickMap = out;

  canvas.onclick = function (ev) {
    const r = canvas.getBoundingClientRect();
    /* 캔버스는 CSS 로 줄여 놓았으므로 실제 픽셀로 되돌립니다 */
    const x = (ev.clientX - r.left) * canvas.width / r.width;
    const y = (ev.clientY - r.top) * canvas.height / r.height;
    const ll = _pickMap.toLatLng(x, y);
    AuriSitePhoto.setPosition(photoId, ll.lat, ll.lng);
    closeMapPick();
    renderAll();
  };
}

function closeMapPick() {
  const w = document.querySelector('.pick-wrap');
  if (w) w.remove();
  _pickMap = null;
}

/* ── 탭 ──────────────────────────────────────────────────────────── */
function showDoc(which) {
  const a = which === 'a';
  document.getElementById('docA').hidden = !a;
  document.getElementById('docB').hidden = a;
  document.getElementById('tabA').classList.toggle('on', a);
  document.getElementById('tabB').classList.toggle('on', !a);
  document.getElementById('printFoot').textContent =
    (a ? '지자체 사전진단서' : '현장 확인 리포트') + (_data ? ' — ' + _data.label : '');
  document.getElementById('docNoteText').innerHTML = a
    ? 'AURI 사전진단서 양식 그대로입니다. 점선 없는 <b>입력칸</b>은 직접 쓰거나 <b>AI 의견 생성</b>으로 초안을 받을 수 있습니다. AI 초안 표시와 판단 근거는 화면에만 보이고 인쇄물에는 나오지 않습니다.'
    : '현장에서 볼 것만 담았습니다. 확인사항은 <b>네모 칸에 체크</b>하며 쓰도록 만들었습니다.';
  AuriDocEdit.refresh();
}

/* ── 그리기 ──────────────────────────────────────────────────────── */
function renderAll() {
  document.getElementById('docA').innerHTML =
    cover() + chapter1() + chapter2() + chapter3() + chapter4() + chapter5();
  document.getElementById('docB').innerHTML = fieldReport();
  AuriDocEdit.refresh();
  /* 지도는 타일을 받아야 해서 시간이 걸립니다. 문서를 먼저 띄우고 뒤따라 채웁니다.
     한 번 그린 것은 _mapCache 에 남아 다시 그리지 않습니다. */
  renderMaps();
}

window.addEventListener('load', async function () {
  /* 물적환경 회귀분석은 7개 지자체에만 있습니다. 없으면 조용히 비고,
     4장의 (물적환경) 줄은 사진 판독만으로 채워집니다. */
  await Promise.all([AuriPalette.load(), AuriPhysical.load()]);

  const loc = sessionStorage.getItem('auri_picked_location');
  const resultsRaw = sessionStorage.getItem('auri_diagnosis_results');
  const rxRaw = sessionStorage.getItem('auri_prescriptions');

  if (!loc || !resultsRaw) {
    document.getElementById('docA').innerHTML =
      '<div class="doc-empty">진단 데이터가 없습니다.<br>위치 선택 → 진단 → 종합 리포트 순서로 진행해 주세요.</div>';
    document.querySelector('.doc-tabs').style.display = 'none';
    return;
  }

  _picked = JSON.parse(loc);
  _results = JSON.parse(resultsRaw);
  _items = rxRaw ? JSON.parse(rxRaw) : [];

  _stats = await AuriStats.load(Number(_picked.lat), Number(_picked.lng));
  _national = await AuriStats.loadNational();
  if (!_stats) {
    document.getElementById('docA').innerHTML =
      '<div class="doc-empty">이 지점의 지자체 통계를 불러오지 못했습니다.</div>';
    return;
  }
  _data = _stats.data;
  _focus = AuriStats.focusCategories(_data);
  _incidents = await loadIncidents(_data.region);   // 지도에 찍을 119 출동 지점
  document.title = `지자체 사전진단서 — ${_data.shortLabel}`;

  renderAll();
  showDoc('a');
});
</script>
</body>
</html>
