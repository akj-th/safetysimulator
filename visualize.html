<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>안전사업지구 진단 — 개선 전/후 시각화</title>

<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  .ba-img{
    width:100%; max-height:min(60vh,560px); object-fit:contain; display:block;
    background:var(--w); border:1px solid var(--g1);
  }

  /* 아직 이미지가 없는 자리 — 빗금 대신 빈 테두리 */
  .ba-blank{
    width:100%; min-height:300px;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:12px; text-align:center; padding:34px;
    background:var(--w); border:1px solid var(--g1);
  }
  .ba-blank svg{width:24px; height:24px; color:var(--g1)}
  .ba-blank .t{font-size:var(--fs-lead); font-weight:700; color:var(--k)}
  .ba-blank .m{font-size:var(--fs-sm); color:var(--g3); max-width:340px; line-height:var(--lh-body)}

  .rx-list{padding:0}
  .rx-item{display:flex; gap:16px; padding:15px 0; border-bottom:1px solid var(--g1); align-items:flex-start}
  .rx-item:last-child{border-bottom:none}
  .rx-priority{
    flex:none; width:46px; padding:2px 0; border-radius:0; background:none;
    font-size:var(--fs-cap); font-weight:700; letter-spacing:.1em;
  }
  .rx-priority.must{color:var(--main)}
  .rx-priority.recommend{color:var(--g2)}
  .rx-body{flex:1; min-width:0}
  .rx-name{font-size:var(--fs-body); font-weight:700; color:var(--k)}
  .rx-cat{font-size:var(--fs-cap); color:var(--g2); font-weight:700; letter-spacing:.12em; margin-left:9px}
  .rx-basis{font-size:var(--fs-cap); color:var(--g2); margin-top:6px; font-family:var(--mono)}
</style>
</head>
<body data-step="4">

<header class="topbar" id="topbar"></header>

<main class="wrap">
  <div class="page-head">
    <h1>개선 전 / 개선 후 시각화</h1>
    <p class="sub">앞 단계에서 정해진 시설물을 원본 거리 사진에 반영해, 개선 후 모습을 이미지로 만듭니다.</p>
  </div>

  <div class="picked" id="picked">
    <span class="dot"></span>
    <div class="info">
      <div class="lab">진단 위치</div>
      <div class="addr" id="pickedAddr">—</div>
      <div class="coord" id="pickedCoord"></div>
    </div>
  </div>

  <!-- ① 개선 전 원본 -->
  <div class="panel">
    <div class="panel-head">
      <h2>개선 전</h2>
      <span class="tag" id="beforeTag">원본 이미지</span>
    </div>
    <img class="ba-img" id="beforeImg" alt="개선 전 거리 이미지" style="display:none">
    <div class="ba-blank" id="beforeBlank">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="8.5" cy="10" r="1.5"/><path d="M21 15l-5-5L5 19"/></svg>
      <div class="t">입력 이미지가 없습니다</div>
      <div class="m">진단 단계에서 스트리트뷰를 캡처하거나 사진을 업로드하면 여기에 표시됩니다.</div>
    </div>
  </div>

  <!-- ② 반영할 시설물 + 생성 실행 -->
  <div class="panel">
    <div class="panel-head">
      <h2>이 이미지에 반영할 시설물</h2>
      <button class="btn-text" id="rxEditBtn" onclick="AuriRx.start()"></button>
      <button class="btn-text" id="rxCancelBtn" style="display:none" onclick="AuriRx.cancel()">취소</button>
      <button class="btn-text" id="rxSaveBtn" style="display:none" onclick="AuriRx.save()">저장</button>
    </div>
    <div class="rx-list" id="rxList"></div>
    <div class="panel-foot">
      <button class="btn ghost sm" id="rxAddBtn" style="display:none" onclick="AuriRx.add()">＋ 항목 추가</button>
      <!-- 목록은 서버(/api/models)에서 받아 채웁니다. 서버에 키가 없는
           제공사의 모델은 아예 나오지 않습니다. -->
      <select id="modelSel" style="width:auto; flex:none" title="같은 사진으로 모델을 바꿔가며 비교해 보세요">
        <option value="gemini-3-pro-image">Gemini 3 Pro · 고성능</option>
      </select>
      <button class="btn accent" id="genBtn" onclick="generateAfter()">개선 이미지 생성</button>
    </div>
  </div>

  <!-- ③ 개선 후 (버튼을 누르면 나타남) -->
  <div class="panel" id="afterPanel" style="display:none">
    <div class="panel-head">
      <h2>개선 후</h2>
      <span class="tag pending" id="afterTag">생성 중</span>
    </div>
    <img class="ba-img" id="afterImg" alt="개선 후 이미지" style="display:none">
    <div class="ba-blank" id="afterBlank">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1"/><circle cx="12" cy="12" r="3.2"/></svg>
      <div class="t" id="afterMsg">이미지를 만들고 있습니다</div>
      <div class="m" id="afterSub">30초 정도 걸립니다.</div>
    </div>
    <!-- 고쳤으면 하는 점을 적어 다시 만드는 칸 -->
    <div class="revise-box" id="tweakBox" style="display:none">
      <div class="lab">어떻게 고쳤으면 하나요?</div>
      <textarea id="tweakNote" placeholder="예) 펜스를 더 낮게 하고 인도 쪽으로 붙여 주세요. 오른쪽 건물 간판이 원본과 달라졌으니 원래대로 되돌려 주세요."></textarea>

      <div class="opt-row">
        <label class="opt">
          <input type="radio" name="tweakBase" value="original" checked>
          <span>
            <span class="t">원본 사진에서 다시 만들기</span>
            <span class="s">시설물을 처음부터 다시 넣습니다. 앞선 생성에서 배경이 틀어졌다면 이쪽이 안전합니다.</span>
          </span>
        </label>
        <label class="opt">
          <input type="radio" name="tweakBase" value="last">
          <span>
            <span class="t">방금 만든 이미지에서 이어서 고치기</span>
            <span class="s">지금 결과가 대체로 마음에 들고 일부만 손보면 될 때 씁니다. 다만 고칠수록 원본에서 조금씩 멀어집니다.</span>
          </span>
        </label>
      </div>

      <div class="actions">
        <button class="btn accent sm" id="tweakSend" onclick="generateAfter(true)">요청 반영해 생성</button>
        <button class="btn ghost sm" onclick="toggleTweak()">닫기</button>
      </div>
    </div>

    <div class="panel-foot" id="afterFoot" style="display:none">
      <button class="btn-text" id="tweakToggle" onclick="toggleTweak()">고칠 점 적어서 다시 만들기</button>
      <span style="flex:1"></span>
      <button class="btn ghost sm" onclick="generateAfter()">같은 조건으로 다시</button>
    </div>
  </div>

  <div class="panel-foot" style="background:none; border:none; padding:0; margin-top:6px">
    <a class="btn accent" href="document.html">진단서 서식 보기</a>
  </div>

  <p class="note">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg>
    위 목록에 있는 시설물만 이미지에 반영됩니다. 결과가 마음에 들지 않으면 고칠 점을 적어 다시 만들 수 있습니다.
  </p>
</main>

<script src="assets/ui.js"></script>
<script src="assets/rules.js"></script>
<script src="assets/rx-editor.js"></script>
<script>
/* ── 개선 후 이미지 생성 ──────────────────────────────────────────
   원본 사진 + 확정된 시설물 목록을 중계 서버로 보냅니다.
   API 키는 서버에만 있으므로 여기서는 다루지 않습니다. */

let _generating = false;
let _lastGenerated = null;      // 마지막으로 만들어진 이미지 (이어서 고칠 때 바탕이 됩니다)

function toggleTweak() {
  const box = document.getElementById('tweakBox');
  const opening = box.style.display === 'none';
  box.style.display = opening ? 'block' : 'none';
  document.getElementById('tweakToggle').textContent = opening ? '닫기' : '고칠 점 적어서 다시 만들기';

  /* 아직 만들어진 이미지가 없으면 "이어서 고치기"는 고를 수 없습니다 */
  const lastOpt = document.querySelector('input[name=tweakBase][value=last]');
  lastOpt.disabled = !_lastGenerated;
  lastOpt.closest('.opt').style.opacity = _lastGenerated ? '1' : '.5';
  if (!_lastGenerated) document.querySelector('input[name=tweakBase][value=original]').checked = true;

  if (opening) document.getElementById('tweakNote').focus();
}

/* useNote 가 true 면 "고칠 점" 칸의 내용을 함께 보냅니다. */
async function generateAfter(useNote) {
  if (_generating) return;

  const inputRaw = sessionStorage.getItem('auri_input_image');
  const items = JSON.parse(sessionStorage.getItem('auri_prescriptions') || '[]');
  if (!inputRaw) { alert('원본 이미지가 없습니다. 진단 단계에서 사진을 먼저 확정해 주세요.'); return; }
  if (!items.length) { alert('반영할 시설물이 없습니다.'); return; }

  const note = useNote ? document.getElementById('tweakNote').value.trim() : '';
  if (useNote && !note) {
    alert('어떻게 고쳤으면 하는지 적어 주세요.');
    return;
  }

  /* 어느 이미지를 바탕으로 만들지 결정합니다 */
  const baseChoice = useNote
    ? document.querySelector('input[name=tweakBase]:checked').value
    : 'original';
  const fromGenerated = baseChoice === 'last' && !!_lastGenerated;
  const baseImage = fromGenerated ? _lastGenerated : JSON.parse(inputRaw).dataUrl;

  const panel = document.getElementById('afterPanel');
  const img = document.getElementById('afterImg');
  const blank = document.getElementById('afterBlank');

  _generating = true;
  panel.style.display = 'block';
  img.style.display = 'none';
  blank.style.display = 'flex';
  document.getElementById('afterMsg').textContent =
    note ? '요청하신 대로 고치고 있습니다' : '이미지를 만들고 있습니다';
  document.getElementById('afterSub').textContent = fromGenerated
    ? '방금 만든 이미지를 바탕으로 요청하신 부분만 손봅니다. 30초 정도 걸립니다.'
    : '원본 사진을 그대로 두고 시설물만 넣도록 지시하고 있습니다. 30초 정도 걸립니다.';
  document.getElementById('afterTag').textContent = '생성 중';
  document.getElementById('afterTag').className = 'tag pending';
  document.getElementById('afterFoot').style.display = 'none';
  document.getElementById('tweakBox').style.display = 'none';
  document.getElementById('genBtn').disabled = true;
  panel.scrollIntoView({ behavior: 'smooth', block: 'nearest' });

  try {
    /* 접속 암호와 오류 안내는 assets/ui.js 의 auriCallServer 가 처리합니다 */
    const data = await auriCallServer('/api/generate', {
      imageDataUrl: baseImage,
      facilities: items.map(function (it) { return it.name; }),
      model: document.getElementById('modelSel').value,
      note: note,
      fromGenerated: fromGenerated,
    });

    _lastGenerated = data.dataUrl;
    img.src = data.dataUrl;
    img.style.display = 'block';
    blank.style.display = 'none';
    document.getElementById('afterTag').textContent =
      (data.model || '생성 완료') + (fromGenerated ? ' · 이어서 수정' : '');
    document.getElementById('afterTag').className = 'tag';
    document.getElementById('tweakNote').value = '';

    /* 진단서 서식4(개선 전/후 비교도)가 이 이미지를 받아 씁니다 */
    try {
      sessionStorage.setItem('auri_after_image', data.dataUrl);
    } catch {
      console.warn('이미지가 커서 진단서로 넘기지 못했습니다.');
    }
  } catch (err) {
    document.getElementById('afterMsg').textContent = '만들지 못했습니다';
    document.getElementById('afterSub').textContent = err.message;
    document.getElementById('afterTag').textContent = '실패';
  } finally {
    _generating = false;
    document.getElementById('afterFoot').style.display = 'flex';
    document.getElementById('tweakToggle').textContent = '고칠 점 적어서 다시 만들기';
    document.getElementById('genBtn').disabled = false;
  }
}
window.addEventListener('load', function () {
  const loc = sessionStorage.getItem('auri_picked_location');
  const rxRaw = sessionStorage.getItem('auri_prescriptions');
  const list = document.getElementById('rxList');

  if (!loc) {
    document.getElementById('pickedAddr').textContent = '진단 데이터가 없습니다.';
    list.innerHTML = '<div class="empty">진단 데이터가 없습니다.<br>위치 선택 → 진단 → 종합 리포트 순서로 진행해 주세요.</div>';
    document.getElementById('genBtn').disabled = true;
    return;
  }

  const picked = JSON.parse(loc);
  document.getElementById('pickedAddr').textContent = picked.addr || '주소 미상';
  document.getElementById('pickedCoord').textContent = `위도 ${picked.lat}, 경도 ${picked.lng}`;

  /* 개선 전 = 진단에 실제로 사용한 그 이미지 */
  const inputImageRaw = sessionStorage.getItem('auri_input_image');
  if (inputImageRaw) {
    const inputImage = JSON.parse(inputImageRaw);
    const img = document.getElementById('beforeImg');
    img.src = inputImage.dataUrl;
    img.style.display = 'block';
    document.getElementById('beforeBlank').style.display = 'none';
    document.getElementById('beforeTag').textContent =
      inputImage.source === 'upload' ? '업로드한 사진' : '캡처한 화면';
  }

  /* 처방 목록 — 여기서 규칙 엔진을 새로 돌리지 않고 리포트 단계의 결과를 받습니다.
     다만 이 화면에서도 시설물을 수정·삭제·추가할 수 있고,
     고친 내용은 리포트 화면과 같은 곳에 저장되어 서로 어긋나지 않습니다. */
  const items = rxRaw ? JSON.parse(rxRaw) : [];

  AuriRx.init({
    listId: 'rxList',
    editBtnId: 'rxEditBtn', saveBtnId: 'rxSaveBtn',
    cancelBtnId: 'rxCancelBtn', addBtnId: 'rxAddBtn',
    showNote: false,
    onChange: function (next) {
      document.getElementById('genBtn').disabled = next.length === 0;
    },
  });
  AuriRx.render(items);

  if (items.length === 0) {
    list.innerHTML = '<div class="empty">반영할 시설물이 없습니다.<br>종합 리포트를 먼저 열어 처방을 생성하거나, 수정을 눌러 직접 추가하세요.</div>';
    document.getElementById('genBtn').disabled = true;
  }

  loadModelList();
});

/* 쓸 수 있는 이미지 생성 모델을 서버에서 받아 선택 상자를 채웁니다.
   서버에 그 제공사 키가 없으면 목록에 오지 않으므로, 고를 수 없는 모델이
   보이는 일이 없습니다. 서버가 없으면(GitHub Pages 등) 그냥 둡니다. */
async function loadModelList() {
  const sel = document.getElementById('modelSel');
  try {
    const res = await fetch('/api/models');
    if (!res.ok) return;
    const body = await res.json();
    if (!body.models || !body.models.length) return;

    sel.innerHTML = body.models.map(function (m) {
      return `<option value="${m.id}">${m.label}</option>`;
    }).join('');
  } catch { /* 서버 없이 화면만 보는 경우 — 기본 항목을 그대로 둡니다 */ }
}
</script>
</body>
</html>
