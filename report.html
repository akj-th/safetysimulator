<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>안전사업지구 진단 — 종합 리포트</title>

<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  /* 종합 위험도 — 사진 판독 / 주변 이력 / 종합 을 나란히.
     둘을 섞은 값 하나만 보이면 점수가 어디서 왔는지 되짚을 수 없습니다. */
  .summary{
    display:grid; grid-template-columns:repeat(3,1fr); gap:0;
    padding:22px 0; margin-bottom:0;
    background:none; border:none; border-radius:0;
    border-top:1px solid var(--g1); border-bottom:1px solid var(--g1);
  }
  .summary .sc + .sc{margin-left:30px; padding-left:30px; border-left:1px solid var(--g1)}
  @media(max-width:660px){
    .summary{grid-template-columns:1fr; gap:22px}
    .summary .sc + .sc{padding-left:0; margin-left:0; border-left:none}
  }
  .summary .lab{font-size:var(--fs-cap); font-weight:700; letter-spacing:.15em; color:var(--g2)}
  /* 요약 점수는 이 화면의 유일한 큰 숫자 — 스케일 밖의 표시용 크기 */
  .summary .v{font-size:39px; font-weight:700; letter-spacing:-.03em; color:var(--g3); line-height:1.15; margin-top:7px}
  .summary .d{font-size:var(--fs-sm); color:var(--g2); margin-top:5px; line-height:var(--lh-body)}
  .summary .is-total .lab{color:var(--main)}
  .summary .is-total .v{font-size:52px; color:var(--k)}
  .summary .v .badge{font-size:var(--fs-sm); margin-left:10px; vertical-align:middle}

  .summary-note{font-size:var(--fs-sm); color:var(--g3); line-height:var(--lh-body); margin:14px 0 34px}
  .summary-note b{color:var(--k); font-weight:700}
  .summary-note .parts{color:var(--g2); font-size:var(--fs-cap)}

  .input-image{
    width:100%; max-height:420px; object-fit:contain; display:block;
    background:var(--w); border:1px solid var(--g1);
  }

  .result-list{padding:0}
  .result-item{padding:13px 0; border-bottom:1px solid var(--g1)}
  .result-item:last-child{border-bottom:none}
  .result-row{display:flex; align-items:center; gap:14px}
  .result-row .name{width:98px; flex:none; font-size:var(--fs-body); font-weight:700; color:var(--k)}
  .result-row .badge{width:48px; flex:none}
  .result-why{margin-top:7px; padding-left:112px; font-size:var(--fs-sm); color:var(--g3); line-height:var(--lh-body)}
  @media(max-width:640px){ .result-why{padding-left:0} }

  /* 우선순위는 칠한 알약이 아니라 글자로만 */
  .rx-list{padding:0}
  .rx-item{display:flex; gap:16px; padding:16px 0; border-bottom:1px solid var(--g1); align-items:flex-start}
  .rx-item:last-child{border-bottom:none}
  .rx-priority{
    flex:none; width:46px; padding:2px 0; border-radius:0; background:none;
    font-size:var(--fs-cap); font-weight:700; letter-spacing:.1em;
  }
  .rx-priority.must{color:var(--main)}
  .rx-priority.recommend{color:var(--g2)}
  .rx-body{flex:1; min-width:0}
  .rx-name{font-size:var(--fs-body); font-weight:700; color:var(--k)}
  .rx-cat{font-size:var(--fs-cap); color:var(--g2); font-weight:700; letter-spacing:.12em; margin-left:9px}
  .rx-note{font-size:var(--fs-body); color:var(--g3); margin-top:4px; line-height:var(--lh-body)}
  .rx-basis{font-size:var(--fs-cap); color:var(--g2); margin-top:7px; font-family:var(--mono)}

  /* 상한으로 빠진 시설물 안내 */
  .rx-cap{font-size:var(--fs-sm); color:var(--g3); line-height:var(--lh-body); margin-top:16px; padding-left:15px; border-left:2px solid var(--g1)}
  .rx-cap:empty{display:none}
  .rx-cap b{color:var(--k); font-weight:700}
</style>
</head>
<body data-step="3">

<header class="topbar" id="topbar"></header>

<main class="wrap">
  <div class="page-head">
    <h1>종합 진단 리포트</h1>
    <p class="sub">주의·위험 판정이 나온 분야에 필요한 개선 시설물이 자동으로 정해집니다. 점수와 시설물 모두 직접 고칠 수 있습니다.</p>
  </div>

  <div class="picked" id="picked">
    <span class="dot"></span>
    <div class="info">
      <div class="lab">진단 위치</div>
      <div class="addr" id="pickedAddr">—</div>
      <div class="coord" id="pickedCoord"></div>
    </div>
  </div>

  <div class="summary" id="summary" style="display:none">
    <div class="sc">
      <div class="lab">사진 판독</div>
      <div class="v" id="scPhoto">—</div>
      <div class="d">거리 이미지에서 읽은 7개 분야 평균</div>
    </div>
    <div class="sc">
      <div class="lab">주변 이력</div>
      <div class="v" id="scHistory">—</div>
      <div class="d" id="scHistoryDesc">—</div>
    </div>
    <div class="sc is-total">
      <div class="lab">종합 위험도</div>
      <div class="v"><span id="scTotal">—</span><span class="badge" id="summaryBadge"></span></div>
      <div class="d" id="scBlend">—</div>
    </div>
  </div>
  <p class="summary-note" id="summaryNote"></p>

  <div class="panel" id="inputImagePane" style="display:none">
    <div class="panel-head">
      <h2>진단에 사용된 이미지</h2>
      <span class="tag" id="inputImageTag"></span>
    </div>
    <img class="input-image" id="inputImage" alt="진단 입력 이미지">
  </div>

  <!-- 항목별 점수 (9단계 · 보정 가능) -->
  <div class="panel">
    <div class="panel-head">
      <h2>항목별 점수</h2>
      <button class="btn-text" id="scoreEditBtn" onclick="startScoreEdit()"></button>
      <button class="btn-text" id="scoreCancelBtn" style="display:none" onclick="cancelScoreEdit()">취소</button>
      <button class="btn-text" id="scoreSaveBtn" style="display:none" onclick="saveScoreEdit()">저장</button>
    </div>
    <div class="result-list" id="resultList"></div>
  </div>

  <!-- 개선 시설물 처방 (수정 · 삭제 · 추가 가능) -->
  <div class="panel">
    <div class="panel-head">
      <h2>개선 시설물 처방</h2>
      <span class="tag">자동 선정</span>
      <button class="btn-text" id="rxEditBtn" onclick="AuriRx.start()"></button>
      <button class="btn-text" id="rxCancelBtn" style="display:none" onclick="AuriRx.cancel()">취소</button>
      <button class="btn-text" id="rxSaveBtn" style="display:none" onclick="AuriRx.save()">저장</button>
    </div>
    <div class="rx-list" id="rxList"></div>
    <p class="rx-cap" id="rxCap"></p>
    <div class="panel-foot">
      <button class="btn ghost sm" id="rxAddBtn" style="display:none" onclick="AuriRx.add()">＋ 항목 추가</button>
      <a class="btn accent" href="visualize.html">개선 전/후 시각화</a>
    </div>
  </div>

  <p class="note">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg>
    점수에 따라 필요한 시설물이 자동으로 정해집니다. 수정을 눌러 항목을 고치거나 지우거나 새로 추가할 수 있으며, 손댄 항목은 따로 표시되어 남습니다.
  </p>
</main>

<script src="assets/ui.js"></script>
<script src="assets/risk-weights.js"></script>
<script src="assets/rules.js"></script>
<script src="assets/rx-editor.js"></script>
<script>
let _results = null;      // 분야별 점수 (사진 판독) — 주변 이력으로 바꾸지 않습니다
let _localRisk = null;    // 주변 119 이력 종합 지수 (1단계에서 계산해 넘겨받음)
let _rxDraft = null;      // 처방 편집 중인 임시 목록

/* ── 항목별 점수 ────────────────────────────────────────────────── */

function renderResults() {
  document.getElementById('resultList').innerHTML = _results.map(function (r) {
    const why = (r.observed && r.observed.length)
      ? `<div class="result-why">${r.observed.join(' · ')}</div>` : '';
    return `
      <div class="result-item ${r.level.key}">
        <div class="result-row">
          <span class="name">${r.name}</span>
          ${auriScaleHTML(r.level.step)}
          <span class="step-num">${r.level.step}/9</span>
          <span class="badge">${r.level.label}</span>
          ${r.edited ? '<span class="mark-edited">보정됨</span>' : ''}
        </div>
        ${why}
      </div>`;
  }).join('');

  document.getElementById('scoreEditBtn').innerHTML = AURI_ICON_EDIT + '수정';
  toggleScoreButtons(false);
  renderSummary();
}

function toggleScoreButtons(editing) {
  document.getElementById('scoreEditBtn').style.display = editing ? 'none' : 'inline-flex';
  document.getElementById('scoreSaveBtn').style.display = editing ? 'inline-flex' : 'none';
  document.getElementById('scoreCancelBtn').style.display = editing ? 'inline-flex' : 'none';
}

function startScoreEdit() {
  toggleScoreButtons(true);
  document.getElementById('resultList').innerHTML = _results.map(function (r) {
    return `
      <div class="result-item ${r.level.key}" id="row-${r.key}">
        <div class="edit-row">
          <span class="name">${r.name}</span>
          <input type="range" min="1" max="9" step="1" value="${r.level.step}"
                 oninput="onSlide('${r.key}', this.value)">
          <span class="step-num" id="num-${r.key}">${r.level.step}/9</span>
          <span class="badge" id="badge-${r.key}">${r.level.label}</span>
        </div>
      </div>`;
  }).join('');
}

function onSlide(key, value) {
  const lv = auriLevel(auriStepToScore(value));
  document.getElementById('row-' + key).className = 'result-item ' + lv.key;
  document.getElementById('num-' + key).textContent = lv.step + '/9';
  document.getElementById('badge-' + key).textContent = lv.label;
}

function cancelScoreEdit() { renderResults(); }

function saveScoreEdit() {
  _results = _results.map(function (r) {
    const step = Number(document.querySelector(`#row-${r.key} input[type=range]`).value);
    if (step === r.level.step) return r;
    const score = auriStepToScore(step);
    return Object.assign({}, r, { score: score, level: auriLevel(score), edited: true });
  });
  sessionStorage.setItem('auri_diagnosis_results', JSON.stringify(_results));
  renderResults();
  recomputePrescriptions();   // 점수가 바뀌면 처방도 다시 뽑습니다
}

/* 종합 위험도 = 사진 판독 + 주변 이력.
   두 값을 하나로 합쳐 버리면 "이 점수가 사진에서 나온 것인지 통계에서
   나온 것인지"를 되짚을 수 없습니다. 그래서 섞은 값과 함께 원래 두 값을
   나란히 남깁니다. 사진 판독 점수(_results)는 이 계산으로 바뀌지 않습니다. */
function renderSummary() {
  const photo = Math.round(_results.reduce(function (s, r) { return s + r.score; }, 0) / _results.length);
  const hist = _localRisk;
  const total = auriBlendScore(photo, hist ? hist.score : null);
  const lv = auriLevel(total);

  document.getElementById('summary').style.display = 'grid';
  document.getElementById('scPhoto').textContent = photo;
  document.getElementById('scTotal').textContent = total;

  const badge = document.getElementById('summaryBadge');
  badge.textContent = lv.label;
  badge.className = 'badge ' + lv.key;

  const note = document.getElementById('summaryNote');
  const reading =
    lv.key === 'lv-safe' ? '전반적으로 취약 요소가 적은 편입니다.' :
    lv.key === 'lv-caution' ? '일부 항목에서 취약 요소가 발견되었습니다.' :
    '여러 항목에서 취약 요소가 두드러집니다.';

  if (!hist) {
    document.getElementById('scHistory').textContent = '—';
    document.getElementById('scHistoryDesc').textContent = '신고 이력 없음';
    document.getElementById('scBlend').textContent = '사진 판독 점수를 그대로 사용';
    note.innerHTML = `${reading} 이 지점 주변에는 지난 3년간 119 응급신고 이력이 없어, ` +
      '종합 위험도는 사진 판독 결과만으로 계산했습니다.';
    return;
  }

  const photoPct = Math.round(RISK_BLEND_PHOTO * 100);
  document.getElementById('scHistory').textContent = hist.score;
  document.getElementById('scHistoryDesc').textContent = `반경 ${hist.radius}m · 3개년 119 신고 이력`;
  document.getElementById('scBlend').textContent = `사진 ${photoPct} : 이력 ${100 - photoPct} 반영`;

  const parts = (hist.top || []).map(function (t) { return `${t.name || t.key} ${t.share}%`; }).join(' · ');

  note.innerHTML = `${reading} <b>사진 판독</b>은 이 자리에서 눈에 보이는 취약 요소를, ` +
    `<b>주변 이력</b>은 반경 ${hist.radius}m 안에서 실제로 일어난 일을 봅니다. ` +
    '두 값을 나란히 두는 것은 종합 점수가 어디에서 나왔는지 되짚을 수 있게 하기 위해서입니다. ' +
    '아래 항목별 점수와 개선 시설물은 <b>사진 판독 결과만</b>으로 정해집니다.' +
    (parts ? `<br><span class="parts">주변 이력 구성 — ${parts}</span>` : '');
}

/* ── 개선 시설물 처방 ───────────────────────────────────────────
   목록 표시와 편집은 assets/rx-editor.js 가 담당합니다.
   이 화면에서만 규칙 엔진을 돌리고, 시각화·진단서는 결과를 받아 씁니다. */
function recomputePrescriptions() {
  AuriRx.recompute();
}
/* ── 페이지 시작 ───────────────────────────────────────────────── */

window.addEventListener('load', function () {
  const loc = sessionStorage.getItem('auri_picked_location');
  const resultsRaw = sessionStorage.getItem('auri_diagnosis_results');

  if (!loc || !resultsRaw) {
    document.getElementById('pickedAddr').textContent = '진단 데이터가 없습니다. 앞 단계를 먼저 진행해 주세요.';
    document.getElementById('resultList').innerHTML = '<div class="empty">진단 결과가 없습니다.</div>';
    document.getElementById('rxList').innerHTML = '<div class="empty">진단 결과가 없어 처방을 만들 수 없습니다.</div>';
    document.getElementById('scoreEditBtn').style.display = 'none';
    document.getElementById('rxEditBtn').style.display = 'none';
    return;
  }

  const picked = JSON.parse(loc);
  _results = JSON.parse(resultsRaw);
  _localRisk = picked.risk || null;

  document.getElementById('pickedAddr').textContent = picked.addr || '주소 미상';
  document.getElementById('pickedCoord').textContent = `위도 ${picked.lat}, 경도 ${picked.lng}`;

  const inputImageRaw = sessionStorage.getItem('auri_input_image');
  if (inputImageRaw) {
    const inputImage = JSON.parse(inputImageRaw);
    document.getElementById('inputImagePane').style.display = 'block';
    document.getElementById('inputImage').src = inputImage.dataUrl;
    document.getElementById('inputImageTag').textContent =
      inputImage.source === 'upload' ? '업로드한 사진' : '캡처한 화면';
  }

  AuriRx.init({
    listId: 'rxList',
    editBtnId: 'rxEditBtn', saveBtnId: 'rxSaveBtn',
    cancelBtnId: 'rxCancelBtn', addBtnId: 'rxAddBtn',
    capId: 'rxCap',
    showNote: true,
    onChange: function () { auriRenderSteps(); },   // 다음 단계 잠금 해제
  });

  renderResults();
  recomputePrescriptions();
});
</script>
</body>
</html>
